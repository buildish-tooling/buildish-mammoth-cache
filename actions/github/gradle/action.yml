name: Buildish Mammoth Cache Action for Gradle
description: >-
  Cache management for Gradle builds in GitHub Actions with verified wrapper provisioning. Use a dedicated cache root and compatible Action versions across cooperating jobs.
author: Buildish
inputs:
  config-file:
    description: Optional workspace-relative JSON or YAML configuration file. Direct action inputs override file values; secrets and GitHub context inputs are direct-only.
    required: false
  base-directory:
    description: Repository-relative project base directory. Rooted paths and paths that escape the workspace are rejected. Defaults to `.`.
    required: false
  cache-enabled:
    description: 'Enables cache orchestration. Accepted values: true or false. Defaults to `true`.'
    required: false
  overlay-fs:
    description: Allows OverlayFS for eligible cache operations. Set to false to use the ordinary cache path. Defaults to `true`.
    required: false
  dependency-cache-layer:
    description: Enables eligible Gradle wrapper workers to use a dependency seed and selects a family whose publishers retain eligible partitions. All cooperating jobs use the same value. Defaults to `true`.
    required: false
  export-layer-environment:
    description: Exports the activated Gradle dependency seed as GRADLE_RO_DEP_CACHE for later steps. False emits only the seed-path output; the workflow configures every consumer. Defaults to `true`.
    required: false
  read-only:
    description: Disables cache and delta writes. Pull-request events default to true; repository config may make the policy stricter, but only a direct workflow input may lower that floor.
    required: false
  job-mode:
    description: 'Cache coordination mode: standalone, distributed-worker, distributed-aggregator, or prepare-only. Defaults to `standalone`.'
    required: false
  dependent-jobs:
    description: Comma- or newline-separated worker job names consumed by a distributed aggregator.
    required: false
  worker-artifact-retention-days:
    description: Requested worker artifact retention in whole days (1–400). Backend limits may shorten it; shorter retention narrows the retry window. Defaults to `7`.
    required: false
  allow-duplicate-dependent-delta-paths:
    description: Allows a distributed aggregator to resolve non-identical overlapping worker paths by newest modification time. Exact same-content overlaps remain safe without this option. Defaults to `false`.
    required: false
  cache-key-prefix:
    description: Namespace prefix for action-owned cache families; build, partition, ref-lineage, and generation identity are appended automatically. Defaults to `buildish-mammoth-cache-`.
    required: false
  cache-partitions:
    description: JSON array of cache partition overrides and custom partitions. Hard safety exclusions remain non-overridable.
    required: false
  cache-max-directory-entries:
    description: Maximum direct entries per managed directory. Must be a positive safe integer. Defaults to `100000`.
    required: false
  cleanup-enabled:
    description: Enables restore cleanup and timestamp garbage collection. Defaults to `true`.
    required: false
  restore-cleanup-mode:
    description: 'Restore-time cleanup mode: none or prune-managed. Defaults to `none`.'
    required: false
  cache-gc-mode:
    description: 'Managed-cache GC: timestamp uses file age and current-build activity; off disables deletion only. Defaults to `timestamp`.'
    required: false
  cache-gc-older-than-days:
    description: File-mtime age threshold for timestamp GC, not historical inactivity. Must be at least 2 days. Defaults to `14`.
    required: false
  dependency-gc-interval-days:
    description: 'Days between completed periodic GC sweeps. Defaults to `3`.'
    required: false
  dependency-gc-force-grace-days:
    description: 'Additional days before an aggregator can sweep with incomplete worker coverage. Use off to disable forcing. Defaults to `1`.'
    required: false
  github-token:
    description: Optional GitHub token for authenticated API requests. Pass secrets directly, never through repository config.
    required: false
  github-job-check-run-id:
    description: Optional check-run ID used to create a direct current-job link.
    required: false
  github-event-name:
    description: Optional triggering-event override for reusable workflows. Pass the trusted caller event.
    required: false
  github-job-name:
    description: Optional stable job-name override used for distributed artifact coordination.
    required: false
  github-ref-name:
    description: Optional resolved-ref override for reusable workflows.
    required: false
  github-default-branch:
    description: Optional repository default-branch override for reusable workflows.
    required: false
  process-all-wrapper-files:
    description: Processes every matching Gradle wrapper properties file. Cannot be combined with wrapper-properties-files. Defaults to `false`.
    required: false
  wrapper-properties-glob:
    description: Repository-relative Gradle wrapper properties discovery glob. Defaults to `**/gradle/wrapper/gradle-wrapper.properties`.
    required: false
  wrapper-properties-files:
    description: Comma- or newline-separated explicit Gradle wrapper properties files relative to base-directory.
    required: false
  gradle-user-home:
    description: Gradle user home to manage. The current version accepts only the runner default.
    required: false
  setup-java:
    description: Reserved compatibility flag. The current version rejects true; run actions/setup-java first. Defaults to `false`.
    required: false
outputs:
  gradle-ro-dep-cache:
    description: Invocation-owned Gradle read-only dependency cache path, or empty when layered restore is inactive.
  cache-family-key:
    description: Stable compatibility family shared by structurally compatible generations.
  cache-lineage-prefix:
    description: Current-ref prefix used to restore the newest immutable generation.
  base-cache-restore-status:
    description: Classified base-cache restore outcome for prepare.
  dependency-gc-due:
    description: 'Whether periodic GC is due for the selected generation. Values are true, false, or unknown.'
  restored-cache-key:
    description: Exact immutable generation restored during prepare, when any.
  read-only:
    description: Whether cache and delta writes are disabled.
  job-mode:
    description: Effective standalone or distributed job mode.
  dependent-delta-status:
    description: 'Dependent-delta outcome: not-configured, applied, or skipped-read-only.'
  dependent-delta-artifact-count:
    description: Number of dependent worker artifacts applied during prepare.
runs:
  using: node24
  main: ../../../dist/github/gradle/main/index.cjs
  post: ../../../dist/github/gradle/post/index.cjs
