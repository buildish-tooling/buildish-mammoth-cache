# SYNC: When adding, removing, or changing any input description or default here, update these
# files too. See docs/dev/maintenance.md § "Action input documentation sync" for the full list
# and rationale. Search for SYNC in the repository to find all sync-obligated locations.

name: Buildish Mammoth Cache Action for Maven
description: Local and distributed cache management for Maven builds in GitHub Actions.
author: Buildish
inputs:
  config-file:
    description: >-
      Optional workspace-relative `.json`, `.yml`, or `.yaml` configuration file.
      The file must contain a top-level object whose keys use the same kebab-case
      names as this action's inputs. Direct action inputs override values loaded
      from the file. `github-token` is intentionally rejected in config files;
      pass secrets directly as action inputs or environment variables instead.
    required: false
  base-directory:
    description: >-
      Repository-relative base directory. Windows-style relative paths using `\`
      are accepted and normalized internally, but drive-prefixed, rooted, and UNC
      paths are rejected. Must stay inside the workspace. Default: `.`.
    required: false
    default: .
  cache-enabled:
    description: >-
      Enables Maven cache orchestration for this action. Accepted values: `true`
      or `false`. Default: `true`.
    required: false
    default: 'true'
  read-only:
    description: >-
      Prevents persistence of modified cache state. Accepted values: `true` or
      `false`. Defaults to `true` for pull requests and `false` for other events
      when omitted.
    required: false
  job-mode:
    description: >-
      Cache coordination mode. Supported values: `standalone`,
      `distributed-worker`, or `distributed-aggregator`. Default: `standalone`.
    required: false
    default: standalone
  dependent-jobs:
    description: >-
      Comma- or newline-separated dependent job names whose cache deltas should be
      consumed later. Only valid with distributed job modes.
    required: false
  allow-duplicate-dependent-delta-paths:
    description: >-
      Only for `distributed-aggregator` jobs. Accepted values: `true` or `false`.
      Default: `false`. When `true`, overlapping dependent-job delta paths that do
      not match exactly may be resolved by choosing the entry with the newest
      modification time instead of failing.
    required: false
    default: 'false'
  cache-key-prefix:
    description: >-
      Namespace prefix used for action-generated cache families. The action
      always appends build tool, schema, Java, runner, partition, ref-lineage,
      and immutable-generation identity. Must start with an alphanumeric
      character and then use only letters, numbers, dot, underscore, and dash.
      Default: `buildish-mammoth-cache-`.
    required: false
    default: buildish-mammoth-cache-
  cache-partitions:
    description: >-
      Optional JSON array of cache partition overrides and custom partitions.
      Each object must contain `id`, `includes`, and optional `excludes`, all
      relative to the Maven local repository root (`.m2` directory). Built-in
      partition IDs are `repository` and `wrapper-dists`. Overriding a built-in
      partition replaces its include/exclude lists. Giving a built-in partition an
      empty `includes` array disables it. Custom partitions must have at least one
      include.
    required: false
  cache-gc-mode:
    description: >-
      Best-effort managed cache garbage-collection mode applied before
      standalone or distributed-aggregator jobs save the base cache. Supported
      values: `off` and `timestamp`.
      `timestamp` deletes managed files only when both access and modification
      timestamps are older than `cache-gc-older-than-days`. Default:
      `timestamp`.
    required: false
    default: timestamp
  cache-gc-older-than-days:
    description: >-
      Age threshold in days for `cache-gc-mode=timestamp`. Must be at least `2`
      days so Linux `relatime` and similarly deferred access-time updates are not
      treated as precise same-day usage data. Default: `14`.
    required: false
    default: '14'
  maven-local-repository:
    description: >-
      Optional absolute path or repository-relative path to the Maven local
      repository root (the `.m2` directory). Defaults to `$MAVEN_USER_HOME` when
      set, otherwise `${user.home}/.m2`.
    required: false
  cleanup-enabled:
    description: >-
      Enables post-build cache cleanup. Accepted values: `true` or `false`.
      Default: `true`.
    required: false
    default: 'true'
  restore-cleanup-mode:
    description: >-
      Cleanup mode applied before the build starts. Supported values: `none`.
      Default: `none`.
    required: false
    default: none
  github-token:
    description: >-
      Optional GitHub token used for GitHub API requests. When omitted, the
      action falls back to the `GITHUB_TOKEN` environment variable if available.
    required: false
  github-job-check-run-id:
    description: >-
      Optional override for the current GitHub job check-run ID.
      When set, job URLs point at that specific check run instead of the workflow
      run page.
    required: false
  github-event-name:
    description: >-
      Optional override for the triggering event name. Required in reusable workflows
      invoked via `workflow_call`, where GitHub sets `GITHUB_EVENT_NAME` to `workflow_call`
      instead of the original caller's event name. Pass `github.event_name` from
      the caller workflow. Typical values: `push`, `pull_request`.
    required: false
  github-job-name:
    description: >-
      Optional override for the job name used in cache coordination and artifact naming.
      Use in reusable workflows to assign a stable, predictable job name independent of
      the GitHub Actions job key or matrix label.
    required: false
  github-ref-name:
    description: >-
      Optional override for the resolved ref name used in cache keys. Required in reusable
      workflows invoked via `workflow_call` to propagate the caller's ref name. Pass
      `github.ref_name` (or an equivalent resolved value) from the caller workflow.
    required: false
  github-default-branch:
    description: >-
      Optional override for the repository's default branch name used in cache key fallbacks.
      Required in reusable workflows invoked via `workflow_call` to propagate the caller's
      default branch. Pass `github.event.repository.default_branch` from the caller.
    required: false
outputs:
  cache-family-key:
    description: Stable compatibility family shared by structurally compatible cache generations.
  cache-lineage-prefix:
    description: Current-ref prefix used to restore the newest immutable cache generation.
  base-cache-restore-status:
    description: Classified base-cache restore outcome for the prepare phase.
  restored-cache-key:
    description: Exact immutable generation key restored by the prepare phase, when any.
  read-only:
    description: Whether cache and delta writes are disabled for this execution.
  job-mode:
    description: Effective standalone or distributed job mode.
runs:
  using: node24
  main: ../../../dist/github/maven/main/index.cjs
  post: ../../../dist/github/maven/post/index.cjs
