name: Buildish Mammoth Cache Action for Maven
description: Local and distributed cache management for Maven builds in GitHub Actions.
author: Buildish
inputs:
  config-file:
    description: Optional workspace-relative JSON or YAML configuration file. Direct action inputs override file values; secrets and GitHub context inputs are direct-only.
    required: false
  base-directory:
    description: Repository-relative project base directory. Rooted paths and paths that escape the workspace are rejected.
    required: false
    default: .
  cache-enabled:
    description: 'Enables cache orchestration. Accepted values: true or false.'
    required: false
    default: 'true'
  read-only:
    description: Disables cache and delta writes. Pull-request events default to true; repository config may make the policy stricter, but only a direct workflow input may lower that floor.
    required: false
  job-mode:
    description: 'Cache coordination mode: standalone, distributed-worker, or distributed-aggregator.'
    required: false
    default: standalone
  dependent-jobs:
    description: Comma- or newline-separated worker job names consumed by a distributed aggregator.
    required: false
  allow-duplicate-dependent-delta-paths:
    description: Allows a distributed aggregator to resolve non-identical overlapping worker paths by newest modification time. Exact same-content overlaps remain safe without this option.
    required: false
    default: 'false'
  cache-key-prefix:
    description: Namespace prefix for action-owned cache families; build, runner, partition, ref-lineage, and generation identity are appended automatically.
    required: false
    default: buildish-mammoth-cache-
  cache-partitions:
    description: JSON array of cache partition overrides and custom partitions. Hard safety exclusions remain non-overridable.
    required: false
  cleanup-enabled:
    description: Enables restore cleanup and timestamp garbage collection.
    required: false
    default: 'true'
  restore-cleanup-mode:
    description: 'Restore-time cleanup mode: none or prune-managed.'
    required: false
    default: none
  cache-gc-mode:
    description: 'Pre-save managed-cache garbage collection mode: off or timestamp.'
    required: false
    default: timestamp
  cache-gc-older-than-days:
    description: Age threshold for timestamp garbage collection. Must be at least 2 days.
    required: false
    default: '14'
  github-token:
    description: Optional GitHub token for authenticated API requests. Pass secrets directly, never through repository config.
    required: false
  github-job-check-run-id:
    description: Optional check-run ID used to create a direct current-job link.
    required: false
  github-event-name:
    description: Optional triggering-event override for reusable workflows. Pass the trusted caller event.
    required: false
  github-job-name:
    description: Optional stable job-name override used for distributed artifact coordination.
    required: false
  github-ref-name:
    description: Optional resolved-ref override for reusable workflows.
    required: false
  github-default-branch:
    description: Optional repository default-branch override for reusable workflows.
    required: false
  maven-user-home:
    description: Absolute or working-directory-relative Maven user home to manage, including repository/ and wrapper/dists/; defaults to MAVEN_USER_HOME or ~/.m2.
    required: false
outputs:
  cache-family-key:
    description: Stable compatibility family shared by structurally compatible generations.
  cache-lineage-prefix:
    description: Current-ref prefix used to restore the newest immutable generation.
  base-cache-restore-status:
    description: Classified base-cache restore outcome for prepare.
  restored-cache-key:
    description: Exact immutable generation restored during prepare, when any.
  read-only:
    description: Whether cache and delta writes are disabled.
  job-mode:
    description: Effective standalone or distributed job mode.
  dependent-delta-status:
    description: 'Dependent-delta outcome: not-configured, applied, or skipped-read-only.'
  dependent-delta-artifact-count:
    description: Number of dependent worker artifacts applied during prepare.
runs:
  using: node24
  main: ../../../dist/github/maven/main/index.cjs
  post: ../../../dist/github/maven/post/index.cjs
