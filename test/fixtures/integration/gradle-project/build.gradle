plugins {
  id 'java-library'
}

repositories {
  mavenCentral()
}

configurations {
  standalone
  workerA
  workerB
  workerC
}

dependencies {
  standalone 'org.apache.commons:commons-lang3:3.20.0'
  workerA 'com.google.guava:guava:33.6.0-jre'
  workerB 'commons-io:commons-io:2.22.0'
  workerC 'org.apache.commons:commons-collections4:4.5.0'
}

def registerResolver = { taskName, configurationName ->
  tasks.register(taskName) {
    doLast {
      configurations.named(configurationName).get().files.each { file ->
        println("resolved ${configurationName}: ${file.name}")
      }
    }
  }
}

registerResolver('resolveStandalone', 'standalone')

tasks.register('resolveLayeredStandalone') {
  doLast {
    def seed = System.getenv('GRADLE_RO_DEP_CACHE')
    assert seed : 'Missing read-only dependency seed'
    def store = new File(seed, 'modules-2/files-2.1').canonicalFile.toPath()
    def artifact = configurations.standalone.singleFile.canonicalFile
    assert artifact.toPath().startsWith(store) : "Resolved outside seed: ${artifact}"
    assert artifact.bytes.length > 0 : 'Empty seed artifact'
    println("resolved seed artifact: ${artifact}")
  }
}
registerResolver('resolveWorkerA', 'workerA')
registerResolver('resolveWorkerB', 'workerB')

registerResolver('resolveWorkerC', 'workerC')

@CacheableTask
abstract class PortableText extends DefaultTask {
  @Input abstract Property<String> getIdentity()
  @OutputFile abstract RegularFileProperty getDestination()
  @TaskAction void writeOutput() {
    destination.get().asFile.bytes = identity.get().getBytes('UTF-8')
  }
}

tasks.register('portable', PortableText) {
  identity = 'mammoth portable output'
  destination = layout.buildDirectory.file('portable.txt')
}
