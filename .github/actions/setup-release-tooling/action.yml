name: Set Up Release Tooling
description: Install the reviewed PyPI wheel in an isolated runner-temp environment; report version and origin.
outputs:
  python:
    description: Absolute path to the verified installed Release Tooling interpreter.
    value: ${{ steps.install.outputs.python }}
runs:
  using: composite
  steps:
    - id: install
      shell: bash
      run: |
        set -euo pipefail
        python3 -m venv "$RUNNER_TEMP/release-tooling"
        python="$RUNNER_TEMP/release-tooling/bin/python"
        "$python" -m pip --isolated download --index-url https://pypi.org/simple \
          --cache-dir "$RUNNER_TEMP/pip-cache" --no-deps --only-binary=:all: \
          --dest "$RUNNER_TEMP/release-wheel" -r buildish-release-tooling/requirements.txt
        (cd "$RUNNER_TEMP/release-wheel" && sha256sum --check "$GITHUB_WORKSPACE/buildish-release-tooling/tooling-wheel.sha256")
        "$python" -m pip --isolated install --index-url https://pypi.org/simple \
          --cache-dir "$RUNNER_TEMP/pip-cache" --only-binary=:all: \
          "$RUNNER_TEMP/release-wheel/buildish_release_tooling-0.1.4-py3-none-any.whl"
        BUILDISH_RELEASE_TOOLING_PYTHON="$python" bash buildish-release-tooling/release-tooling.sh --package-info
        printf 'python=%s\n' "$python" >> "$GITHUB_OUTPUT"
