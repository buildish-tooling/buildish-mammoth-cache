name: Integration Test Setup
description: >-
  Set up Node.js, install action dependencies, bundle the action, and configure
  Java for an integration test job. Callers must run actions/checkout first.

runs:
  using: composite
  steps:
    - name: Set up Node.js and npm
      uses: ./.github/actions/setup-node-npm
      with:
        cache: npm
        cache-dependency-path: package-lock.json

    - name: Install action dependencies
      shell: bash
      run: npm ci

    - name: Bundle the action
      shell: bash
      run: npm run bundle

    - name: Set up Java 21
      uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95 # v5.6.0
      with:
        distribution: temurin
        java-version: '21'
