name: Releasey Create Release Branch

on:
  workflow_dispatch:
    inputs:
      release_line:
        description: Release line such as 1.x or 1.2.x
        required: true
        type: string
      source_ref:
        description: Source ref such as main or release/1.x
        required: true
        type: string

permissions:
  contents: read

env:
  BUILDISH_RELEASE_TOOLING_REF: main # renovate: datasource=github-releases depName=buildish-tooling/buildish-release-tooling currentValue=v0.0.0
  BUILDISH_RELEASE_TOOLING_CHECKOUT_PATH: .buildish-internal/buildish-release-tooling

jobs:
  create-release-branch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: buildish-tooling/buildish-release-tooling
          ref: ${{ env.BUILDISH_RELEASE_TOOLING_REF }}
          path: ${{ env.BUILDISH_RELEASE_TOOLING_CHECKOUT_PATH }}
          fetch-depth: 1
          persist-credentials: false
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
      - name: Install Python 3.13 for uv-managed commands
        run: uv python install 3.13
      - name: Fetch remote heads and tags
        run: |
          git fetch --force --prune --tags origin '+refs/heads/*:refs/remotes/origin/*'
      - name: Draft branch creation
        env:
          RELEASE_LINE: ${{ inputs.release_line }}
          SOURCE_REF: ${{ inputs.source_ref }}
        run: |
          bash buildish-release-tooling/release-tooling.sh create-release-branch \
            --apply \
            "$RELEASE_LINE" \
            "$SOURCE_REF"
