name: Publish aggregate site after released docs change

on:
  push:
    branches:
      - versioned-docs

permissions: {}

jobs:
  publish-site:
    name: Publish aggregate site
    if: >-
      github.repository == 'buildish-tooling/buildish-mammoth-cache' &&
      github.event.deleted == false
    runs-on: ubuntu-26.04
    steps:
      - name: Dispatch aggregate site publishing
        # The token needs Actions write access to buildish-tooling/buildish.
        env:
          GH_TOKEN: ${{ secrets.BUILDISH_SITE_PUBLISH_TOKEN }}
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "::error::Set BUILDISH_SITE_PUBLISH_TOKEN with Actions write access to buildish-tooling/buildish."
            exit 1
          fi
          gh workflow run site-publish.yml --repo buildish-tooling/buildish --ref main
