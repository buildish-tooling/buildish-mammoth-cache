name: IT Mammoth Cache for Maven (Reusable)

# Real GitHub integration scenario graph for Mammoth Cache for Maven.
#
# Scenario layout:
# - maven_standalone_round_trip exercises a writable Linux cache round-trip by capturing the
#   action-generated cache key, saving a cache snapshot immediately, wiping the Maven local
#   repository, restoring that exact key, and proving the fixture resolves offline.
# - maven_worker_a + maven_worker_b -> maven_aggregator exercises distributed worker delta
#   publication plus same-run aggregator download/merge/apply using deterministic worker job names.
#   Assertion: both worker-profile dependencies resolve offline in the aggregator after merge.
# - maven_duplicate_invocation_guard proves duplicate same-job action usage is rejected.
# - maven_pull_request_worker -> maven_pull_request_read_only checks the full PR read-only
#   distributed topology under minimal permissions.
# - maven_standalone_cross_platform is a lightweight smoke check on macOS/Windows only.
#   Maven (from setup-java) is available on all runners; no GnuPG setup is required.
#
# Isolation/safety notes:
# - Every scenario stages a fresh fixture copy into a unique per-job build directory.
# - Every cache-key-prefix includes github.run_id/github.run_attempt, so parallel workflow runs,
#   retries, and sequential branch builds do not reuse writable cache keys accidentally.
# - Distributed artifact exchange stays within the current workflow run only.

on:
  workflow_call:
    inputs:
      caller-event-name:
        description: >-
          Original caller workflow event name. Reusable workflows execute as `workflow_call`, so
          the action needs the caller event to preserve event-based read-only and ref behavior.
        required: true
        type: string
      caller-resolved-ref-name:
        description: >-
          Logical ref name from the caller workflow that the action should treat as the effective
          branch for cache partitioning and summaries.
        required: true
        type: string
      caller-default-branch:
        description: >-
          Repository default branch from the caller workflow so reusable runs do not depend on the
          callee's `workflow_call` payload shape.
        required: true
        type: string
      run-pr-scenarios:
        description: >-
          Run the fork-safe pull-request worker/aggregator topology that verifies PR events stay
          read-only, workers upload nothing, and aggregation is an explicit no-op.
        required: true
        type: boolean
      run-writable-scenarios:
        description: >-
          Run the trusted Linux scenarios that are allowed to publish cache/artifact outputs:
          standalone cache round-trip, distributed worker/aggregator flow, and duplicate-job guard.
        required: true
        type: boolean
      run-cross-platform:
        description: >-
          Run the lightweight standalone macOS/Windows smoke scenario.
        required: false
        default: false
        type: boolean

permissions:
  contents: read

env:
  ACTION_DIRECTORY: .
  FIXTURE_SOURCE_DIRECTORY: test/fixtures/integration/maven-project

jobs:
  # Performs a deterministic same-job save -> wipe -> restore cycle using the action-generated
  # cache key, which avoids relying on post-job cache propagation timing between separate jobs.
  maven_standalone_round_trip:
    name: Linux Maven standalone round-trip (offline exact restore)
    if: inputs.run-writable-scenarios
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up integration test environment
        uses: ./.github/actions/it-setup

      - name: Stage fixture
        run: bash .github/scripts/stage-fixture.sh maven-standalone-round-trip

      - name: Prepare Mammoth Cache for Maven
        id: prepare
        uses: ./actions/github/maven
        with:
          base-directory: build/integration-fixtures/maven-standalone-round-trip
          cache-key-prefix: it-maven-standalone-${{ github.run_id }}-${{ github.run_attempt }}-
          github-event-name: ${{ inputs.caller-event-name }}
          github-ref-name: ${{ inputs.caller-resolved-ref-name }}
          github-default-branch: ${{ inputs.caller-default-branch }}
          github-job-name: maven_standalone_round_trip

      - name: Assert prepare outputs
        env:
          ACTION_CACHE_FAMILY_KEY: ${{ steps.prepare.outputs.cache-family-key }}
          ACTION_CACHE_LINEAGE_PREFIX: ${{ steps.prepare.outputs.cache-lineage-prefix }}
          ACTION_BASE_CACHE_RESTORE_STATUS: ${{ steps.prepare.outputs.base-cache-restore-status }}
          ACTION_JOB_MODE: ${{ steps.prepare.outputs.job-mode }}
          ACTION_READ_ONLY: ${{ steps.prepare.outputs.read-only }}
          ACTION_DEPENDENT_DELTA_STATUS: ${{ steps.prepare.outputs.dependent-delta-status }}
          ACTION_DEPENDENT_DELTA_ARTIFACT_COUNT: ${{ steps.prepare.outputs.dependent-delta-artifact-count }}
        run: bash .github/scripts/it-assert-maven-standalone.sh

      - name: Resolve standalone dependencies online
        working-directory: build/integration-fixtures/maven-standalone-round-trip
        run: mvn -P standalone dependency:resolve -q

      - name: Save exact standalone cache snapshot
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.m2/repository
            ~/.m2/wrapper/dists
          key: ${{ steps.prepare.outputs.cache-lineage-prefix }}integration-round-trip

      - name: Wipe Maven local repository to prove restore
        run: |
          rm -rf "$HOME/.m2/repository"
          mkdir -p "$HOME/.m2/repository"

      - name: Restore exact standalone cache snapshot
        id: restore
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.m2/repository
            ~/.m2/wrapper/dists
          key: ${{ steps.prepare.outputs.cache-lineage-prefix }}integration-round-trip

      - name: Verify the saved cache restores offline
        working-directory: build/integration-fixtures/maven-standalone-round-trip
        run: mvn -P standalone dependency:resolve --offline -q

      - name: Assert exact cache reuse
        run: test "${STEPS_RESTORE_OUTPUTS_CACHE_HIT}" = 'true'
        env:
          STEPS_RESTORE_OUTPUTS_CACHE_HIT: ${{ steps.restore.outputs.cache-hit }}

  # Workers A and B each publish one independent same-run delta artifact for the aggregator.
  # They run in parallel via a matrix; both must complete before the aggregator starts.
  maven_workers:
    name: Linux Maven distributed ${{ matrix.worker.label }} (publish delta artifact)
    if: inputs.run-writable-scenarios
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        worker:
          - { id: maven_worker_a, label: 'worker A', profile: worker-a }
          - { id: maven_worker_b, label: 'worker B', profile: worker-b }
    defaults:
      run:
        shell: bash
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up integration test environment
        uses: ./.github/actions/it-setup

      - name: Stage fixture
        run: bash .github/scripts/stage-fixture.sh ${{ matrix.worker.id }}

      - name: Prepare Mammoth Cache for Maven
        uses: ./actions/github/maven
        with:
          base-directory: build/integration-fixtures/${{ matrix.worker.id }}
          job-mode: distributed-worker
          cache-key-prefix: it-maven-distributed-${{ github.run_id }}-${{ github.run_attempt }}-
          github-event-name: ${{ inputs.caller-event-name }}
          github-ref-name: ${{ inputs.caller-resolved-ref-name }}
          github-default-branch: ${{ inputs.caller-default-branch }}
          github-job-name: ${{ matrix.worker.id }}

      - name: Produce worker cache delta
        working-directory: build/integration-fixtures/${{ matrix.worker.id }}
        run: mvn -P ${{ matrix.worker.profile }} dependency:resolve -q

  # Aggregator waits for both workers, downloads their current-run artifacts, applies both deltas,
  # and confirms the merged dependencies resolve offline before post-action cleanup removes consumed
  # worker artifacts.
  maven_aggregator:
    name: Linux Maven distributed aggregator (download+merge worker deltas)
    if: inputs.run-writable-scenarios
    needs: [maven_workers]
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up integration test environment
        uses: ./.github/actions/it-setup

      - name: Stage fixture
        run: bash .github/scripts/stage-fixture.sh maven-aggregator

      - name: Prepare Mammoth Cache for Maven
        id: prepare
        uses: ./actions/github/maven
        with:
          base-directory: build/integration-fixtures/maven-aggregator
          job-mode: distributed-aggregator
          dependent-jobs: maven_worker_a,maven_worker_b
          cache-key-prefix: it-maven-distributed-${{ github.run_id }}-${{ github.run_attempt }}-
          github-event-name: ${{ inputs.caller-event-name }}
          github-ref-name: ${{ inputs.caller-resolved-ref-name }}
          github-default-branch: ${{ inputs.caller-default-branch }}
          github-job-name: maven_aggregator

      - name: Verify worker A dependency (guava) resolves offline after delta merge
        working-directory: build/integration-fixtures/maven-aggregator
        run: mvn -P worker-a dependency:resolve --offline -q

      - name: Verify worker B dependency (commons-io) resolves offline after delta merge
        working-directory: build/integration-fixtures/maven-aggregator
        run: mvn -P worker-b dependency:resolve --offline -q

      - name: Assert both worker artifacts were consumed
        env:
          ACTION_BASE_CACHE_RESTORE_STATUS: ${{ steps.prepare.outputs.base-cache-restore-status }}
          ACTION_JOB_MODE: ${{ steps.prepare.outputs.job-mode }}
          ACTION_DEPENDENT_DELTA_STATUS: ${{ steps.prepare.outputs.dependent-delta-status }}
          ACTION_DEPENDENT_DELTA_ARTIFACT_COUNT: ${{ steps.prepare.outputs.dependent-delta-artifact-count }}
        run: bash .github/scripts/it-assert-maven-aggregator.sh

  # Proves that two action invocations in the same GitHub job cannot race or double-run post-work.
  maven_duplicate_invocation_guard:
    name: Linux Maven duplicate invocation guard (same-job safety)
    if: inputs.run-writable-scenarios
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up integration test environment
        uses: ./.github/actions/it-setup

      - name: Stage fixture
        run: bash .github/scripts/stage-fixture.sh maven-duplicate-guard

      - name: First action invocation succeeds
        uses: ./actions/github/maven
        with:
          base-directory: build/integration-fixtures/maven-duplicate-guard
          cache-enabled: false
          read-only: true
          github-event-name: ${{ inputs.caller-event-name }}
          github-ref-name: ${{ inputs.caller-resolved-ref-name }}
          github-default-branch: ${{ inputs.caller-default-branch }}
          github-job-name: maven_duplicate_invocation_guard

      - name: Duplicate action invocation is rejected
        id: duplicate_action
        continue-on-error: true
        uses: ./actions/github/maven
        with:
          base-directory: build/integration-fixtures/maven-duplicate-guard
          cache-enabled: false
          read-only: true
          github-event-name: ${{ inputs.caller-event-name }}
          github-ref-name: ${{ inputs.caller-resolved-ref-name }}
          github-default-branch: ${{ inputs.caller-default-branch }}
          github-job-name: maven_duplicate_invocation_guard

      - name: Assert the duplicate invocation failed
        run: test "${STEPS_DUPLICATE_ACTION_OUTCOME}" = 'failure'
        env:
          STEPS_DUPLICATE_ACTION_OUTCOME: ${{ steps.duplicate_action.outcome }}

  # A PR worker exercises distributed-worker finalize without artifact write permission.
  maven_pull_request_worker:
    name: Maven pull request distributed worker (no artifact upload)
    if: inputs.run-pr-scenarios
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up integration test environment
        uses: ./.github/actions/it-setup

      - name: Stage fixture
        run: bash .github/scripts/stage-fixture.sh maven-pull-request-worker

      - name: Prepare Mammoth Cache for Maven
        uses: ./actions/github/maven
        with:
          base-directory: build/integration-fixtures/maven-pull-request-worker
          job-mode: distributed-worker
          cache-key-prefix: it-maven-pr-${{ github.run_id }}-${{ github.run_attempt }}-
          github-event-name: ${{ inputs.caller-event-name }}
          github-ref-name: ${{ inputs.caller-resolved-ref-name }}
          github-default-branch: ${{ inputs.caller-default-branch }}
          github-job-name: maven_pull_request_worker

      - name: Run a read-only PR worker build
        working-directory: build/integration-fixtures/maven-pull-request-worker
        run: mvn -P worker-a dependency:resolve -q

  # Validates the full PR worker/aggregator topology under minimal permissions.
  maven_pull_request_read_only:
    name: Maven pull request aggregator (explicit read-only no-op)
    if: inputs.run-pr-scenarios
    needs: [maven_pull_request_worker]
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up integration test environment
        uses: ./.github/actions/it-setup

      - name: Stage fixture
        run: bash .github/scripts/stage-fixture.sh maven-pull-request

      - name: Prepare Mammoth Cache for Maven
        id: prepare
        uses: ./actions/github/maven
        with:
          base-directory: build/integration-fixtures/maven-pull-request
          job-mode: distributed-aggregator
          dependent-jobs: maven_pull_request_worker
          cache-key-prefix: it-maven-pr-${{ github.run_id }}-${{ github.run_attempt }}-
          github-event-name: ${{ inputs.caller-event-name }}
          github-ref-name: ${{ inputs.caller-resolved-ref-name }}
          github-default-branch: ${{ inputs.caller-default-branch }}
          github-job-name: maven_pull_request_read_only

      - name: Run a read-only PR aggregator build
        working-directory: build/integration-fixtures/maven-pull-request
        run: mvn -P standalone dependency:resolve -q

      - name: Assert the PR default stayed read-only
        env:
          ACTION_BASE_CACHE_RESTORE_STATUS: ${{ steps.prepare.outputs.base-cache-restore-status }}
          ACTION_JOB_MODE: ${{ steps.prepare.outputs.job-mode }}
          ACTION_READ_ONLY: ${{ steps.prepare.outputs.read-only }}
          ACTION_DEPENDENT_DELTA_STATUS: ${{ steps.prepare.outputs.dependent-delta-status }}
          ACTION_DEPENDENT_DELTA_ARTIFACT_COUNT: ${{ steps.prepare.outputs.dependent-delta-artifact-count }}
        run: bash .github/scripts/it-assert-maven-pr.sh

  # Lightweight macOS/Windows smoke coverage. No GnuPG setup required for Maven.
  maven_standalone_cross_platform:
    name: Maven cross-platform standalone smoke (${{ matrix.os }})
    if: inputs.run-cross-platform
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    defaults:
      run:
        shell: bash
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up integration test environment
        uses: ./.github/actions/it-setup

      - name: Stage fixture
        run: bash .github/scripts/stage-fixture.sh maven-cross-platform-${{ matrix.os }}

      - name: Prepare Mammoth Cache for Maven
        uses: ./actions/github/maven
        with:
          base-directory: build/integration-fixtures/maven-cross-platform-${{ matrix.os }}
          cache-key-prefix: it-maven-cross-platform-${{ matrix.os }}-${{ github.run_id }}-${{ github.run_attempt }}-
          read-only: true
          github-event-name: ${{ inputs.caller-event-name }}
          github-ref-name: ${{ inputs.caller-resolved-ref-name }}
          github-default-branch: ${{ inputs.caller-default-branch }}
          github-job-name: maven_standalone_cross_platform

      - name: Verify Maven runs on this runner
        run: mvn --version
