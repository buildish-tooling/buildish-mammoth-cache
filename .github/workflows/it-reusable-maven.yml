name: IT Mammoth Cache for Maven (Reusable)

# Real GitHub integration scenario graph for Mammoth Cache for Maven.
#
# Scenario layout:
# - maven_standalone_round_trip exercises a writable Linux cache round-trip by capturing the
#   action-generated cache key, saving a cache snapshot immediately, wiping the Maven local
#   repository, restoring that exact key, and proving the fixture resolves offline.
# - maven_worker_a + maven_worker_b -> maven_aggregator exercises distributed worker delta
#   publication plus same-run aggregator download/merge/apply using deterministic worker job names.
#   Assertion: both worker-profile dependencies resolve offline in the aggregator after merge.
# - maven_duplicate_invocation_guard proves duplicate same-job action usage is rejected.
# - maven_pull_request_read_only checks the default PR read-only behavior under minimal permissions.
# - maven_standalone_cross_platform is a lightweight smoke check on macOS/Windows only.
#   Maven (from setup-java) is available on all runners; no GnuPG setup is required.
#
# Isolation/safety notes:
# - Every scenario stages a fresh fixture copy into a unique per-job build directory.
# - Every cache-key-prefix includes github.run_id/github.run_attempt, so parallel workflow runs,
#   retries, and sequential branch builds do not reuse writable cache keys accidentally.
# - Distributed artifact exchange stays within the current workflow run only.

on:
  workflow_call:
    inputs:
      caller-event-name:
        description: >-
          Original caller workflow event name. Reusable workflows execute as `workflow_call`, so
          the action needs the caller event to preserve event-based read-only and ref behavior.
        required: true
        type: string
      caller-resolved-ref-name:
        description: >-
          Logical ref name from the caller workflow that the action should treat as the effective
          branch for cache partitioning and summaries.
        required: true
        type: string
      caller-default-branch:
        description: >-
          Repository default branch from the caller workflow so reusable runs do not depend on the
          callee's `workflow_call` payload shape.
        required: true
        type: string
      run-pr-scenarios:
        description: >-
          Run the fork-safe pull-request scenario that verifies PR events stay read-only by default.
        required: true
        type: boolean
      run-writable-scenarios:
        description: >-
          Run the trusted Linux scenarios that are allowed to publish cache/artifact outputs:
          standalone cache round-trip, distributed worker/aggregator flow, and duplicate-job guard.
        required: true
        type: boolean
      run-cross-platform:
        description: >-
          Run the lightweight standalone macOS/Windows smoke scenario.
        required: false
        default: false
        type: boolean

permissions:
  contents: read

env:
  ACTION_DIRECTORY: .
  FIXTURE_SOURCE_DIRECTORY: test/fixtures/integration/maven-project
  BUILDISH_MAMMOTH_CACHE_GITHUB_EVENT_NAME_OVERRIDE: ${{ inputs.caller-event-name }}
  BUILDISH_MAMMOTH_CACHE_GITHUB_RESOLVED_REF_NAME_OVERRIDE: ${{ inputs.caller-resolved-ref-name }}
  BUILDISH_MAMMOTH_CACHE_GITHUB_DEFAULT_BRANCH_OVERRIDE: ${{ inputs.caller-default-branch }}

jobs:
  # Performs a deterministic same-job save -> wipe -> restore cycle using the action-generated
  # cache key, which avoids relying on post-job cache propagation timing between separate jobs.
  maven_standalone_round_trip:
    name: Linux Maven standalone round-trip (offline exact restore)
    if: inputs.run-writable-scenarios
    runs-on: ubuntu-latest
    env:
      BUILDISH_MAMMOTH_CACHE_GITHUB_JOB_NAME_OVERRIDE: maven_standalone_round_trip
    defaults:
      run:
        shell: bash
    steps:
      - name: Check out repository
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1

      - name: Set up Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install action dependencies
        working-directory: ${{ env.ACTION_DIRECTORY }}
        run: npm ci

      - name: Bundle the action
        working-directory: ${{ env.ACTION_DIRECTORY }}
        run: npm run bundle

      - name: Set up Java 21
        uses: actions/setup-java@dded0888837ed1f317902acf8a20df0ad188d165 # v5.0.0
        with:
          distribution: temurin
          java-version: '21'

      - name: Stage standalone fixture
        run: |
          fixture_dir="${ACTION_DIRECTORY}/build/integration-fixtures/maven-standalone-round-trip"
          rm -rf "$fixture_dir"
          mkdir -p "$fixture_dir"
          cp -R "$FIXTURE_SOURCE_DIRECTORY"/. "$fixture_dir"

      - name: Prepare Mammoth Cache for Maven
        id: prepare_standalone_cache
        uses: ./actions/github/maven
        with:
          base-directory: build/integration-fixtures/maven-standalone-round-trip
          cache-key-prefix: it-maven-standalone-${{ github.run_id }}-${{ github.run_attempt }}-

      - name: Emit standalone prepare outputs
        env:
          ACTION_CACHE_KEY: ${{ steps.prepare_standalone_cache.outputs.cache-key }}
          ACTION_BASE_CACHE_RESTORE_STATUS: ${{ steps.prepare_standalone_cache.outputs.base-cache-restore-status }}
          ACTION_JAVA_MAJOR: ${{ steps.prepare_standalone_cache.outputs.java-major }}
          ACTION_JOB_MODE: ${{ steps.prepare_standalone_cache.outputs.job-mode }}
          ACTION_READ_ONLY: ${{ steps.prepare_standalone_cache.outputs.read-only }}
          ACTION_RESOLVED_REF_NAME: ${{ steps.prepare_standalone_cache.outputs.resolved-ref-name }}
          ACTION_SAFE_REF_NAME: ${{ steps.prepare_standalone_cache.outputs.safe-ref-name }}
          ACTION_DEPENDENT_JOBS_COUNT: ${{ steps.prepare_standalone_cache.outputs.dependent-jobs-count }}
          ACTION_DOWNLOADED_DEPENDENT_ARTIFACT_COUNT: ${{ steps.prepare_standalone_cache.outputs.downloaded-dependent-artifact-count }}
          ACTION_JOB_NAME: ${{ steps.prepare_standalone_cache.outputs.job-name }}
        run: |
          printf '%s\n' \
            "cache-key=$ACTION_CACHE_KEY" \
            "base-cache-restore-status=$ACTION_BASE_CACHE_RESTORE_STATUS" \
            "java-major=$ACTION_JAVA_MAJOR" \
            "job-mode=$ACTION_JOB_MODE" \
            "read-only=$ACTION_READ_ONLY" \
            "resolved-ref-name=$ACTION_RESOLVED_REF_NAME" \
            "safe-ref-name=$ACTION_SAFE_REF_NAME" \
            "dependent-jobs-count=$ACTION_DEPENDENT_JOBS_COUNT" \
            "downloaded-dependent-artifact-count=$ACTION_DOWNLOADED_DEPENDENT_ARTIFACT_COUNT" \
            "job-name=$ACTION_JOB_NAME"

      - name: Assert standalone prepare outputs
        env:
          ACTION_BASE_CACHE_RESTORE_STATUS: ${{ steps.prepare_standalone_cache.outputs.base-cache-restore-status }}
          ACTION_JAVA_MAJOR: ${{ steps.prepare_standalone_cache.outputs.java-major }}
          ACTION_JOB_MODE: ${{ steps.prepare_standalone_cache.outputs.job-mode }}
          ACTION_RESOLVED_REF_NAME: ${{ steps.prepare_standalone_cache.outputs.resolved-ref-name }}
          ACTION_SAFE_REF_NAME: ${{ steps.prepare_standalone_cache.outputs.safe-ref-name }}
          ACTION_DEPENDENT_JOBS_COUNT: ${{ steps.prepare_standalone_cache.outputs.dependent-jobs-count }}
          CALLER_RESOLVED_REF_NAME: ${{ inputs.caller-resolved-ref-name }}
        run: |
          expected_safe_ref_name="$(printf '%s' "$CALLER_RESOLVED_REF_NAME" | sed -E 's/[ /]+/-/g; s/[^A-Za-z0-9._-]/-/g; s/-+/-/g; s/^-+|-+$//g')"
          test "$ACTION_BASE_CACHE_RESTORE_STATUS" = 'miss'
          test "$ACTION_JAVA_MAJOR" = '21'
          test "$ACTION_JOB_MODE" = 'standalone'
          test "$ACTION_RESOLVED_REF_NAME" = "$CALLER_RESOLVED_REF_NAME"
          test "$ACTION_SAFE_REF_NAME" = "$expected_safe_ref_name"
          test "$ACTION_DEPENDENT_JOBS_COUNT" = '0'

      - name: Resolve standalone dependencies online
        working-directory: build/integration-fixtures/maven-standalone-round-trip
        run: mvn -P standalone dependency:resolve -q

      - name: Save exact standalone cache snapshot
        uses: actions/cache/save@0400d5f644dc74513175e3cd8d07132dd4860809 # v4.2.4
        with:
          path: |
            ~/.m2/repository
            ~/.m2/wrapper/dists
          key: ${{ steps.prepare_standalone_cache.outputs.cache-key }}

      - name: Wipe Maven local repository to prove restore
        run: |
          rm -rf "$HOME/.m2/repository"
          mkdir -p "$HOME/.m2/repository"

      - name: Restore exact standalone cache snapshot
        id: restore_standalone_cache
        uses: actions/cache/restore@0400d5f644dc74513175e3cd8d07132dd4860809 # v4.2.4
        with:
          path: |
            ~/.m2/repository
            ~/.m2/wrapper/dists
          key: ${{ steps.prepare_standalone_cache.outputs.cache-key }}

      - name: Verify the saved cache restores offline
        working-directory: build/integration-fixtures/maven-standalone-round-trip
        run: mvn -P standalone dependency:resolve --offline -q

      - name: Assert exact cache reuse
        run: |
          test "${{ steps.restore_standalone_cache.outputs.cache-hit }}" = 'true'

  # Worker A publishes one same-run delta artifact for the distributed aggregator scenario.
  maven_worker_a:
    name: Linux Maven distributed worker A (publish delta artifact)
    if: inputs.run-writable-scenarios
    runs-on: ubuntu-latest
    env:
      BUILDISH_MAMMOTH_CACHE_GITHUB_JOB_NAME_OVERRIDE: maven_worker_a
    defaults:
      run:
        shell: bash
    steps:
      - name: Check out repository
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1

      - name: Set up Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install action dependencies
        working-directory: ${{ env.ACTION_DIRECTORY }}
        run: npm ci

      - name: Bundle the action
        working-directory: ${{ env.ACTION_DIRECTORY }}
        run: npm run bundle

      - name: Set up Java 21
        uses: actions/setup-java@dded0888837ed1f317902acf8a20df0ad188d165 # v5.0.0
        with:
          distribution: temurin
          java-version: '21'

      - name: Stage worker A fixture
        run: |
          fixture_dir="${ACTION_DIRECTORY}/build/integration-fixtures/maven-worker-a"
          rm -rf "$fixture_dir"
          mkdir -p "$fixture_dir"
          cp -R "$FIXTURE_SOURCE_DIRECTORY"/. "$fixture_dir"

      - name: Prepare Mammoth Cache for Maven
        id: prepare_worker_a_cache
        uses: ./actions/github/maven
        with:
          base-directory: build/integration-fixtures/maven-worker-a
          job-mode: distributed-worker
          cache-key-prefix: it-maven-distributed-${{ github.run_id }}-${{ github.run_attempt }}-

      - name: Produce worker A cache delta (resolve guava)
        working-directory: build/integration-fixtures/maven-worker-a
        run: mvn -P worker-a dependency:resolve -q

  # Worker B publishes an independent same-run delta artifact for the distributed aggregator.
  maven_worker_b:
    name: Linux Maven distributed worker B (publish delta artifact)
    if: inputs.run-writable-scenarios
    runs-on: ubuntu-latest
    env:
      BUILDISH_MAMMOTH_CACHE_GITHUB_JOB_NAME_OVERRIDE: maven_worker_b
    defaults:
      run:
        shell: bash
    steps:
      - name: Check out repository
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1

      - name: Set up Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install action dependencies
        working-directory: ${{ env.ACTION_DIRECTORY }}
        run: npm ci

      - name: Bundle the action
        working-directory: ${{ env.ACTION_DIRECTORY }}
        run: npm run bundle

      - name: Set up Java 21
        uses: actions/setup-java@dded0888837ed1f317902acf8a20df0ad188d165 # v5.0.0
        with:
          distribution: temurin
          java-version: '21'

      - name: Stage worker B fixture
        run: |
          fixture_dir="${ACTION_DIRECTORY}/build/integration-fixtures/maven-worker-b"
          rm -rf "$fixture_dir"
          mkdir -p "$fixture_dir"
          cp -R "$FIXTURE_SOURCE_DIRECTORY"/. "$fixture_dir"

      - name: Prepare Mammoth Cache for Maven
        id: prepare_worker_b_cache
        uses: ./actions/github/maven
        with:
          base-directory: build/integration-fixtures/maven-worker-b
          job-mode: distributed-worker
          cache-key-prefix: it-maven-distributed-${{ github.run_id }}-${{ github.run_attempt }}-

      - name: Produce worker B cache delta (resolve commons-io)
        working-directory: build/integration-fixtures/maven-worker-b
        run: mvn -P worker-b dependency:resolve -q

  # Aggregator waits for both workers, downloads their current-run artifacts, applies both deltas,
  # and confirms the merged dependencies resolve offline before post-action cleanup removes consumed
  # worker artifacts.
  maven_aggregator:
    name: Linux Maven distributed aggregator (download+merge worker deltas)
    if: inputs.run-writable-scenarios
    needs: [maven_worker_a, maven_worker_b]
    runs-on: ubuntu-latest
    env:
      BUILDISH_MAMMOTH_CACHE_GITHUB_JOB_NAME_OVERRIDE: maven_aggregator
    defaults:
      run:
        shell: bash
    steps:
      - name: Check out repository
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1

      - name: Set up Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install action dependencies
        working-directory: ${{ env.ACTION_DIRECTORY }}
        run: npm ci

      - name: Bundle the action
        working-directory: ${{ env.ACTION_DIRECTORY }}
        run: npm run bundle

      - name: Set up Java 21
        uses: actions/setup-java@dded0888837ed1f317902acf8a20df0ad188d165 # v5.0.0
        with:
          distribution: temurin
          java-version: '21'

      - name: Stage aggregator fixture
        run: |
          fixture_dir="${ACTION_DIRECTORY}/build/integration-fixtures/maven-aggregator"
          rm -rf "$fixture_dir"
          mkdir -p "$fixture_dir"
          cp -R "$FIXTURE_SOURCE_DIRECTORY"/. "$fixture_dir"

      - name: Prepare Mammoth Cache for Maven
        id: prepare_aggregator_cache
        uses: ./actions/github/maven
        with:
          base-directory: build/integration-fixtures/maven-aggregator
          job-mode: distributed-aggregator
          dependent-jobs: maven_worker_a,maven_worker_b
          cache-key-prefix: it-maven-distributed-${{ github.run_id }}-${{ github.run_attempt }}-

      - name: Emit aggregator prepare outputs
        env:
          ACTION_CACHE_KEY: ${{ steps.prepare_aggregator_cache.outputs.cache-key }}
          ACTION_BASE_CACHE_RESTORE_STATUS: ${{ steps.prepare_aggregator_cache.outputs.base-cache-restore-status }}
          ACTION_JAVA_MAJOR: ${{ steps.prepare_aggregator_cache.outputs.java-major }}
          ACTION_JOB_MODE: ${{ steps.prepare_aggregator_cache.outputs.job-mode }}
          ACTION_READ_ONLY: ${{ steps.prepare_aggregator_cache.outputs.read-only }}
          ACTION_RESOLVED_REF_NAME: ${{ steps.prepare_aggregator_cache.outputs.resolved-ref-name }}
          ACTION_SAFE_REF_NAME: ${{ steps.prepare_aggregator_cache.outputs.safe-ref-name }}
          ACTION_DEPENDENT_JOBS_COUNT: ${{ steps.prepare_aggregator_cache.outputs.dependent-jobs-count }}
          ACTION_DOWNLOADED_DEPENDENT_ARTIFACT_COUNT: ${{ steps.prepare_aggregator_cache.outputs.downloaded-dependent-artifact-count }}
          ACTION_JOB_NAME: ${{ steps.prepare_aggregator_cache.outputs.job-name }}
        run: |
          printf '%s\n' \
            "cache-key=$ACTION_CACHE_KEY" \
            "base-cache-restore-status=$ACTION_BASE_CACHE_RESTORE_STATUS" \
            "java-major=$ACTION_JAVA_MAJOR" \
            "job-mode=$ACTION_JOB_MODE" \
            "read-only=$ACTION_READ_ONLY" \
            "resolved-ref-name=$ACTION_RESOLVED_REF_NAME" \
            "safe-ref-name=$ACTION_SAFE_REF_NAME" \
            "dependent-jobs-count=$ACTION_DEPENDENT_JOBS_COUNT" \
            "downloaded-dependent-artifact-count=$ACTION_DOWNLOADED_DEPENDENT_ARTIFACT_COUNT" \
            "job-name=$ACTION_JOB_NAME"

      - name: Verify worker A dependency (guava) resolves offline after delta merge
        working-directory: build/integration-fixtures/maven-aggregator
        run: mvn -P worker-a dependency:resolve --offline -q

      - name: Verify worker B dependency (commons-io) resolves offline after delta merge
        working-directory: build/integration-fixtures/maven-aggregator
        run: mvn -P worker-b dependency:resolve --offline -q

      - name: Assert both worker artifacts were consumed
        env:
          ACTION_BASE_CACHE_RESTORE_STATUS: ${{ steps.prepare_aggregator_cache.outputs.base-cache-restore-status }}
          ACTION_JAVA_MAJOR: ${{ steps.prepare_aggregator_cache.outputs.java-major }}
          ACTION_JOB_MODE: ${{ steps.prepare_aggregator_cache.outputs.job-mode }}
          ACTION_RESOLVED_REF_NAME: ${{ steps.prepare_aggregator_cache.outputs.resolved-ref-name }}
          ACTION_SAFE_REF_NAME: ${{ steps.prepare_aggregator_cache.outputs.safe-ref-name }}
          ACTION_DEPENDENT_JOBS_COUNT: ${{ steps.prepare_aggregator_cache.outputs.dependent-jobs-count }}
          ACTION_DOWNLOADED_DEPENDENT_ARTIFACT_COUNT: ${{ steps.prepare_aggregator_cache.outputs.downloaded-dependent-artifact-count }}
          CALLER_RESOLVED_REF_NAME: ${{ inputs.caller-resolved-ref-name }}
        run: |
          expected_safe_ref_name="$(printf '%s' "$CALLER_RESOLVED_REF_NAME" | sed -E 's/[ /]+/-/g; s/[^A-Za-z0-9._-]/-/g; s/-+/-/g; s/^-+|-+$//g')"
          test "$ACTION_BASE_CACHE_RESTORE_STATUS" = 'miss'
          test "$ACTION_JAVA_MAJOR" = '21'
          test "$ACTION_JOB_MODE" = 'distributed-aggregator'
          test "$ACTION_RESOLVED_REF_NAME" = "$CALLER_RESOLVED_REF_NAME"
          test "$ACTION_SAFE_REF_NAME" = "$expected_safe_ref_name"
          test "$ACTION_DEPENDENT_JOBS_COUNT" = '2'
          test "$ACTION_DOWNLOADED_DEPENDENT_ARTIFACT_COUNT" = '2'

  # Proves that two action invocations in the same GitHub job cannot race or double-run post-work.
  maven_duplicate_invocation_guard:
    name: Linux Maven duplicate invocation guard (same-job safety)
    if: inputs.run-writable-scenarios
    runs-on: ubuntu-latest
    env:
      BUILDISH_MAMMOTH_CACHE_GITHUB_JOB_NAME_OVERRIDE: maven_duplicate_invocation_guard
    defaults:
      run:
        shell: bash
    steps:
      - name: Check out repository
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1

      - name: Set up Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install action dependencies
        working-directory: ${{ env.ACTION_DIRECTORY }}
        run: npm ci

      - name: Bundle the action
        working-directory: ${{ env.ACTION_DIRECTORY }}
        run: npm run bundle

      - name: Set up Java 21
        uses: actions/setup-java@dded0888837ed1f317902acf8a20df0ad188d165 # v5.0.0
        with:
          distribution: temurin
          java-version: '21'

      - name: Stage duplicate-guard fixture
        run: |
          fixture_dir="${ACTION_DIRECTORY}/build/integration-fixtures/maven-duplicate-guard"
          rm -rf "$fixture_dir"
          mkdir -p "$fixture_dir"
          cp -R "$FIXTURE_SOURCE_DIRECTORY"/. "$fixture_dir"

      - name: First action invocation succeeds
        uses: ./actions/github/maven
        with:
          base-directory: build/integration-fixtures/maven-duplicate-guard
          cache-enabled: false
          read-only: true

      - name: Duplicate action invocation is rejected
        id: duplicate_action
        continue-on-error: true
        uses: ./actions/github/maven
        with:
          base-directory: build/integration-fixtures/maven-duplicate-guard
          cache-enabled: false
          read-only: true

      - name: Assert the duplicate invocation failed
        run: |
          test "${{ steps.duplicate_action.outcome }}" = 'failure'

  # Validates the PR default remains read-only under minimal permissions.
  maven_pull_request_read_only:
    name: Maven pull request standalone (default read-only behavior)
    if: inputs.run-pr-scenarios
    runs-on: ubuntu-latest
    env:
      BUILDISH_MAMMOTH_CACHE_GITHUB_JOB_NAME_OVERRIDE: maven_pull_request_read_only
    defaults:
      run:
        shell: bash
    steps:
      - name: Check out repository
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1

      - name: Set up Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install action dependencies
        working-directory: ${{ env.ACTION_DIRECTORY }}
        run: npm ci

      - name: Bundle the action
        working-directory: ${{ env.ACTION_DIRECTORY }}
        run: npm run bundle

      - name: Set up Java 21
        uses: actions/setup-java@dded0888837ed1f317902acf8a20df0ad188d165 # v5.0.0
        with:
          distribution: temurin
          java-version: '21'

      - name: Stage pull-request fixture
        run: |
          fixture_dir="${ACTION_DIRECTORY}/build/integration-fixtures/maven-pull-request"
          rm -rf "$fixture_dir"
          mkdir -p "$fixture_dir"
          cp -R "$FIXTURE_SOURCE_DIRECTORY"/. "$fixture_dir"

      - name: Prepare Mammoth Cache for Maven
        id: prepare_pull_request_cache
        uses: ./actions/github/maven
        with:
          base-directory: build/integration-fixtures/maven-pull-request
          cache-key-prefix: it-maven-pr-${{ github.run_id }}-${{ github.run_attempt }}-

      - name: Run a read-only PR build
        working-directory: build/integration-fixtures/maven-pull-request
        run: mvn -P standalone dependency:resolve -q

      - name: Assert the PR default stayed read-only
        env:
          ACTION_BASE_CACHE_RESTORE_STATUS: ${{ steps.prepare_pull_request_cache.outputs.base-cache-restore-status }}
          ACTION_JAVA_MAJOR: ${{ steps.prepare_pull_request_cache.outputs.java-major }}
          ACTION_JOB_MODE: ${{ steps.prepare_pull_request_cache.outputs.job-mode }}
          ACTION_READ_ONLY: ${{ steps.prepare_pull_request_cache.outputs.read-only }}
          ACTION_RESOLVED_REF_NAME: ${{ steps.prepare_pull_request_cache.outputs.resolved-ref-name }}
          ACTION_SAFE_REF_NAME: ${{ steps.prepare_pull_request_cache.outputs.safe-ref-name }}
          ACTION_DEPENDENT_JOBS_COUNT: ${{ steps.prepare_pull_request_cache.outputs.dependent-jobs-count }}
          CALLER_RESOLVED_REF_NAME: ${{ inputs.caller-resolved-ref-name }}
        run: |
          expected_safe_ref_name="$(printf '%s' "$CALLER_RESOLVED_REF_NAME" | sed -E 's/[ /]+/-/g; s/[^A-Za-z0-9._-]/-/g; s/-+/-/g; s/^-+|-+$//g')"
          test "$ACTION_BASE_CACHE_RESTORE_STATUS" = 'miss'
          test "$ACTION_JAVA_MAJOR" = '21'
          test "$ACTION_JOB_MODE" = 'standalone'
          test "$ACTION_READ_ONLY" = 'true'
          test "$ACTION_RESOLVED_REF_NAME" = "$CALLER_RESOLVED_REF_NAME"
          test "$ACTION_SAFE_REF_NAME" = "$expected_safe_ref_name"
          test "$ACTION_DEPENDENT_JOBS_COUNT" = '0'

  # Lightweight macOS/Windows smoke coverage. No GnuPG setup required for Maven.
  maven_standalone_cross_platform:
    name: Maven cross-platform standalone smoke (${{ matrix.os }})
    if: inputs.run-cross-platform
    runs-on: ${{ matrix.os }}
    env:
      BUILDISH_MAMMOTH_CACHE_GITHUB_JOB_NAME_OVERRIDE: maven_standalone_cross_platform
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    defaults:
      run:
        shell: bash
    steps:
      - name: Check out repository
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1

      - name: Set up Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install action dependencies
        working-directory: ${{ env.ACTION_DIRECTORY }}
        run: npm ci

      - name: Bundle the action
        working-directory: ${{ env.ACTION_DIRECTORY }}
        run: npm run bundle

      - name: Set up Java 21
        uses: actions/setup-java@dded0888837ed1f317902acf8a20df0ad188d165 # v5.0.0
        with:
          distribution: temurin
          java-version: '21'

      - name: Stage cross-platform fixture
        run: |
          fixture_dir="${ACTION_DIRECTORY}/build/integration-fixtures/maven-cross-platform-${{ matrix.os }}"
          rm -rf "$fixture_dir"
          mkdir -p "$fixture_dir"
          cp -R "$FIXTURE_SOURCE_DIRECTORY"/. "$fixture_dir"

      - name: Prepare Mammoth Cache for Maven
        id: prepare_cross_platform_cache
        uses: ./actions/github/maven
        with:
          base-directory: build/integration-fixtures/maven-cross-platform-${{ matrix.os }}
          cache-key-prefix: it-maven-cross-platform-${{ matrix.os }}-${{ github.run_id }}-${{ github.run_attempt }}-
          read-only: true

      - name: Verify Maven runs on this runner
        run: mvn --version
