name: IT Mammoth Cache for Maven (Reusable)

# Real GitHub integration scenario graph for Mammoth Cache for Maven.
#
# Standalone producer -> fresh offline reader.
# Worker matrix -> Linux aggregator -> native readers and Linux warm -> change -> changed reader.
# Pull requests exercise only the read-only worker -> aggregator pair.
# Distributed families stay stable across attempts so partial reruns can reuse worker artifacts.

on:
  workflow_call:
    inputs:
      caller-event-name:
        description: >-
          Original caller workflow event name. Reusable workflows execute as `workflow_call`, so
          the action needs the caller event to preserve event-based read-only and ref behavior.
        required: true
        type: string
      caller-resolved-ref-name:
        description: >-
          Logical ref name from the caller workflow that the action should treat as the effective
          branch for cache partitioning and summaries.
        required: true
        type: string
      caller-default-branch:
        description: >-
          Repository default branch from the caller workflow so reusable runs do not depend on the
          callee's `workflow_call` payload shape.
        required: true
        type: string
      run-pr-scenarios:
        description: >-
          Run the fork-safe pull-request worker/aggregator topology that verifies PR events stay
          read-only, workers upload nothing, and aggregation is an explicit no-op.
        required: true
        type: boolean
      run-writable-scenarios:
        description: >-
          Run the trusted Linux scenarios that are allowed to publish cache/artifact outputs:
          standalone cache round-trip, distributed worker/aggregator flow, and duplicate-job guard.
        required: true
        type: boolean
      run-cross-platform:
        description: >-
          Run native Windows/macOS workers and fresh readers through the existing
          distributed graph; false retains Linux-only distributed checks.
        required: false
        default: false
        type: boolean

permissions:
  contents: read

env:
  ACTION_DIRECTORY: .
  FIXTURE_SOURCE_DIRECTORY: test/fixtures/integration/maven-project
  IT_CACHE_PARTITIONS: >-
    [{"id":"repository","conflict-handling":"choose-worker-directory"},{"id":"it-portability","includes":["it-portability/**"],"publication":"aggregate"}]

jobs:
  maven_standalone_round_trip:
    name: Linux Maven standalone producer
    if: inputs.run-writable-scenarios
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    outputs:
      attempt: ${{ steps.observer.outputs.attempt }}
    defaults:
      run:
        shell: bash
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set isolated cache root
        env:
          IT_CACHE_HOME: ${{ runner.temp }}/mammoth-maven-seed
        run: printf 'MAVEN_USER_HOME=%s\n' "$IT_CACHE_HOME" >> "$GITHUB_ENV"

      - name: Set up integration test environment
        uses: $/.github/actions/it-setup
        with:
          maven: 'true'

      - name: Stage fresh fixture
        run: bash .github/scripts/stage-fixture.sh seed

      - name: Require an empty tool home before prepare
        run: node .github/scripts/it-cache-fixture.mjs empty maven

      - name: Register lifecycle assertion after Mammoth post
        id: observer
        uses: ./.github/actions/it-observe # zizmor: ignore[self-repository] trusted writes are gated by the caller
        with:
          tool: maven
          job: seed
          stage: seed

      - name: Prepare Mammoth Cache for Maven
        id: prepare
        uses: ./actions/github/maven # zizmor: ignore[self-repository] built by it-setup in this workspace
        with:
          base-directory: build/integration-fixtures/seed
          job-mode: standalone
          cache-key-prefix: it-maven-standalone-${{ github.run_id }}-a${{ github.run_attempt }}-
          github-event-name: ${{ inputs.caller-event-name }}
          github-ref-name: ${{ inputs.caller-resolved-ref-name }}
          github-default-branch: ${{ inputs.caller-default-branch }}
          github-job-name: seed

      - name: Assert prepare outputs
        env:
          ACTION_CACHE_FAMILY_KEY: ${{ steps.prepare.outputs.cache-family-key }}
          ACTION_CACHE_LINEAGE_PREFIX: ${{ steps.prepare.outputs.cache-lineage-prefix }}
          ACTION_BASE_CACHE_RESTORE_STATUS: ${{ steps.prepare.outputs.base-cache-restore-status }}
          ACTION_JOB_MODE: ${{ steps.prepare.outputs.job-mode }}
          ACTION_READ_ONLY: ${{ steps.prepare.outputs.read-only }}
          ACTION_DEPENDENT_DELTA_STATUS: ${{ steps.prepare.outputs.dependent-delta-status }}
          ACTION_DEPENDENT_DELTA_ARTIFACT_COUNT: ${{ steps.prepare.outputs.dependent-delta-artifact-count }}
        run: bash .github/scripts/it-assert-maven-standalone.sh

      - name: Resolve standalone dependencies online
        working-directory: build/integration-fixtures/seed
        run: mvn -B "-Dmaven.repo.local=$MAVEN_USER_HOME/repository" -P standalone dependency:resolve

      - name: Require the resolved standalone dependency
        run: node .github/scripts/it-cache-fixture.mjs standalone maven

  maven_standalone_reader:
    name: Linux Maven standalone fresh reader
    if: inputs.run-writable-scenarios
    needs: [maven_standalone_round_trip]
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    defaults:
      run:
        shell: bash
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set isolated cache root
        env:
          IT_CACHE_HOME: ${{ runner.temp }}/mammoth-maven-standalone-reader
        run: printf 'MAVEN_USER_HOME=%s\n' "$IT_CACHE_HOME" >> "$GITHUB_ENV"

      - name: Set up integration test environment
        uses: $/.github/actions/it-setup
        with:
          maven: 'true'

      - name: Stage fresh fixture
        run: bash .github/scripts/stage-fixture.sh standalone-reader

      - name: Require an empty tool home before prepare
        run: node .github/scripts/it-cache-fixture.mjs empty maven

      - name: Register lifecycle assertion after Mammoth post
        uses: ./.github/actions/it-observe # zizmor: ignore[self-repository] trusted writes are gated by the caller
        with:
          tool: maven
          job: standalone-reader
          stage: reader

      - name: Prepare Mammoth Cache for Maven
        id: prepare
        uses: ./actions/github/maven # zizmor: ignore[self-repository] built by it-setup in this workspace
        with:
          base-directory: build/integration-fixtures/standalone-reader
          job-mode: standalone
          cache-key-prefix: it-maven-standalone-${{ github.run_id }}-a${{ needs.maven_standalone_round_trip.outputs.attempt }}-
          read-only: true
          github-event-name: ${{ inputs.caller-event-name }}
          github-ref-name: ${{ inputs.caller-resolved-ref-name }}
          github-default-branch: ${{ inputs.caller-default-branch }}
          github-job-name: standalone-reader

      - name: Require the exact published generation
        uses: ./.github/actions/it-restore-proof # zizmor: ignore[self-repository] reads artifacts from this run
        with:
          tool: maven
          producer: seed
          attempt: ${{ needs.maven_standalone_round_trip.outputs.attempt }}
          prepare: ${{ toJSON(steps.prepare.outputs) }}
          read-only: 'true'

      - name: Require dependency bytes before the offline build
        run: node .github/scripts/it-cache-fixture.mjs standalone maven

      - name: Resolve dependencies offline
        working-directory: build/integration-fixtures/standalone-reader
        run: mvn -B "-Dmaven.repo.local=$MAVEN_USER_HOME/repository" -P standalone dependency:resolve --offline

  maven_workers:
    name: Maven distributed ${{ matrix.worker.id }} (${{ matrix.worker.os }}, Java ${{ matrix.worker.java }})
    if: inputs.run-writable-scenarios
    runs-on: ${{ matrix.worker.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        worker:
          - id: maven_worker_a
            fixture: worker_a
            os: ubuntu-26.04
            arch: x64
            java: '21'
            profile: worker-a
          - id: maven_worker_b
            fixture: worker_b
            os: ${{ inputs.run-cross-platform && 'windows-2025' || 'ubuntu-26.04' }}
            arch: x64
            java: '25'
            profile: worker-b
          - id: maven_worker_c
            fixture: worker_c
            os: ${{ inputs.run-cross-platform && 'macos-15' || 'ubuntu-26.04' }}
            arch: ${{ inputs.run-cross-platform && 'arm64' || 'x64' }}
            java: '21'
            profile: worker-c
    env:
      EXPECTED_ARCH: ${{ matrix.worker.arch }}
    defaults:
      run:
        shell: bash
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set isolated cache root
        env:
          IT_CACHE_HOME: ${{ runner.temp }}/mammoth-maven-${{ matrix.worker.id }}
        run: printf 'MAVEN_USER_HOME=%s\n' "$IT_CACHE_HOME" >> "$GITHUB_ENV"

      - name: Set up integration test environment
        uses: $/.github/actions/it-setup
        with:
          java-version: ${{ matrix.worker.java }}
          maven: 'true'

      - name: Verify runner architecture
        run: node -e "require('node:assert/strict').equal(process.arch, process.env.EXPECTED_ARCH)"

      - name: Stage fixture
        run: bash .github/scripts/stage-fixture.sh ${{ matrix.worker.id }}

      - name: Require an empty tool home before prepare
        run: node .github/scripts/it-cache-fixture.mjs empty maven

      - name: Register lifecycle assertion after Mammoth post
        uses: ./.github/actions/it-observe # zizmor: ignore[self-repository] trusted writes are gated by the caller
        with:
          tool: maven
          job: ${{ matrix.worker.id }}
          stage: worker

      - name: Prepare Mammoth Cache for Maven
        id: prepare
        uses: ./actions/github/maven # zizmor: ignore[self-repository] built by it-setup in this workspace
        with:
          base-directory: build/integration-fixtures/${{ matrix.worker.id }}
          job-mode: distributed-worker
          cache-partitions: ${{ env.IT_CACHE_PARTITIONS }}
          cache-key-prefix: it-maven-distributed-${{ github.run_id }}-
          github-event-name: ${{ inputs.caller-event-name }}
          github-ref-name: ${{ inputs.caller-resolved-ref-name }}
          github-default-branch: ${{ inputs.caller-default-branch }}
          github-job-name: ${{ matrix.worker.id }}

      - name: Seed worker filesystem contribution
        run: node .github/scripts/it-cache-fixture.mjs seed maven ${{ matrix.worker.fixture }}

      - name: Produce worker dependency (POSIX)
        if: runner.os != 'Windows'
        working-directory: build/integration-fixtures/${{ matrix.worker.id }}
        env:
          WORKER_PROFILE: ${{ matrix.worker.profile }}
        run: mvn -B "-Dmaven.repo.local=$MAVEN_USER_HOME/repository" -P "$WORKER_PROFILE" dependency:resolve

      - name: Produce worker dependency (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        working-directory: build/integration-fixtures/${{ matrix.worker.id }}
        env:
          WORKER_PROFILE: ${{ matrix.worker.profile }}
        run: |
          & mvn.cmd -B "-Dmaven.repo.local=$env:MAVEN_USER_HOME/repository" -P $env:WORKER_PROFILE dependency:resolve
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

  maven_aggregator:
    name: Linux Maven distributed aggregator (merge and publish)
    if: inputs.run-writable-scenarios
    needs: [maven_workers]
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    outputs:
      attempt: ${{ steps.observer.outputs.attempt }}
    env:
      EXPECTED_ARCH: x64
    defaults:
      run:
        shell: bash
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set isolated cache root
        env:
          IT_CACHE_HOME: ${{ runner.temp }}/mammoth-maven-aggregator
        run: printf 'MAVEN_USER_HOME=%s\n' "$IT_CACHE_HOME" >> "$GITHUB_ENV"

      - name: Set up integration test environment
        uses: $/.github/actions/it-setup
        with:
          java-version: '21'
          maven: 'true'

      - name: Verify runner architecture
        run: node -e "require('node:assert/strict').equal(process.arch, process.env.EXPECTED_ARCH)"

      - name: Stage fixture
        run: bash .github/scripts/stage-fixture.sh maven_aggregator

      - name: Require an empty tool home before prepare
        run: node .github/scripts/it-cache-fixture.mjs empty maven

      - name: Register lifecycle assertion after Mammoth post
        id: observer
        uses: ./.github/actions/it-observe # zizmor: ignore[self-repository] trusted writes are gated by the caller
        with:
          tool: maven
          job: maven_aggregator
          stage: aggregator

      - name: Prepare Mammoth Cache for Maven
        id: prepare
        uses: ./actions/github/maven # zizmor: ignore[self-repository] built by it-setup in this workspace
        with:
          base-directory: build/integration-fixtures/maven_aggregator
          job-mode: distributed-aggregator
          cache-partitions: ${{ env.IT_CACHE_PARTITIONS }}
          cache-key-prefix: it-maven-distributed-${{ github.run_id }}-
          dependent-jobs: maven_worker_a,maven_worker_b,maven_worker_c
          github-event-name: ${{ inputs.caller-event-name }}
          github-ref-name: ${{ inputs.caller-resolved-ref-name }}
          github-default-branch: ${{ inputs.caller-default-branch }}
          github-job-name: maven_aggregator

      - name: Assert aggregator action outputs
        env:
          ACTION_BASE_CACHE_RESTORE_STATUS: ${{ steps.prepare.outputs.base-cache-restore-status }}
          ACTION_JOB_MODE: ${{ steps.prepare.outputs.job-mode }}
          ACTION_READ_ONLY: ${{ steps.prepare.outputs.read-only }}
          ACTION_DEPENDENT_DELTA_STATUS: ${{ steps.prepare.outputs.dependent-delta-status }}
          ACTION_DEPENDENT_DELTA_ARTIFACT_COUNT: ${{ steps.prepare.outputs.dependent-delta-artifact-count }}
        run: bash .github/scripts/it-assert-maven-aggregator.sh

      - name: Assert every worker filesystem contribution
        run: node .github/scripts/it-cache-fixture.mjs assert maven

      - name: Resolve all worker dependencies offline (POSIX)
        if: runner.os != 'Windows'
        working-directory: build/integration-fixtures/maven_aggregator
        run: mvn -B "-Dmaven.repo.local=$MAVEN_USER_HOME/repository" -P worker-a,worker-b,worker-c dependency:resolve --offline

      - name: Resolve all worker dependencies offline (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        working-directory: build/integration-fixtures/maven_aggregator
        run: |
          & mvn.cmd -B "-Dmaven.repo.local=$env:MAVEN_USER_HOME/repository" -P worker-a,worker-b,worker-c dependency:resolve --offline
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

  maven_duplicate_invocation_guard:
    name: Linux Maven duplicate invocation guard (same-job safety)
    if: inputs.run-writable-scenarios
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    defaults:
      run:
        shell: bash
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up integration test environment
        uses: $/.github/actions/it-setup
        with:
          maven: 'true'

      - name: Stage fixture
        run: bash .github/scripts/stage-fixture.sh maven-duplicate-guard

      - name: First action invocation succeeds
        uses: ./actions/github/maven # zizmor: ignore[self-repository] built by it-setup in this workspace
        with:
          base-directory: build/integration-fixtures/maven-duplicate-guard
          cache-enabled: false
          read-only: true
          github-event-name: ${{ inputs.caller-event-name }}
          github-ref-name: ${{ inputs.caller-resolved-ref-name }}
          github-default-branch: ${{ inputs.caller-default-branch }}
          github-job-name: maven_duplicate_invocation_guard

      - name: Duplicate action invocation is rejected
        id: duplicate_action
        continue-on-error: true
        uses: ./actions/github/maven # zizmor: ignore[self-repository] built by it-setup in this workspace
        with:
          base-directory: build/integration-fixtures/maven-duplicate-guard
          cache-enabled: false
          read-only: true
          github-event-name: ${{ inputs.caller-event-name }}
          github-ref-name: ${{ inputs.caller-resolved-ref-name }}
          github-default-branch: ${{ inputs.caller-default-branch }}
          github-job-name: maven_duplicate_invocation_guard

      - name: Assert the duplicate invocation failed
        run: test "${STEPS_DUPLICATE_ACTION_OUTCOME}" = 'failure'
        env:
          STEPS_DUPLICATE_ACTION_OUTCOME: ${{ steps.duplicate_action.outcome }}

  maven_pull_request_worker:
    name: Maven pull request distributed worker (no artifact upload)
    if: inputs.run-pr-scenarios
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    defaults:
      run:
        shell: bash
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set isolated cache root
        env:
          IT_CACHE_HOME: ${{ runner.temp }}/mammoth-maven-maven_pull_request_worker
        run: printf 'MAVEN_USER_HOME=%s\n' "$IT_CACHE_HOME" >> "$GITHUB_ENV"

      - name: Set up integration test environment
        uses: $/.github/actions/it-setup
        with:
          maven: 'true'

      - name: Stage fixture
        run: bash .github/scripts/stage-fixture.sh maven-pull-request-worker

      - name: Require an empty tool home before prepare
        run: node .github/scripts/it-cache-fixture.mjs empty maven

      - name: Register lifecycle assertion after Mammoth post
        uses: ./.github/actions/it-observe # zizmor: ignore[self-repository] trusted writes are gated by the caller
        with:
          tool: maven
          job: maven_pull_request_worker
          stage: pr

      - name: Prepare Mammoth Cache for Maven
        id: prepare
        uses: ./actions/github/maven # zizmor: ignore[self-repository] built by it-setup in this workspace
        with:
          base-directory: build/integration-fixtures/maven-pull-request-worker
          job-mode: distributed-worker
          cache-key-prefix: it-maven-pr-${{ github.run_id }}-
          github-event-name: ${{ inputs.caller-event-name }}
          github-ref-name: ${{ inputs.caller-resolved-ref-name }}
          github-default-branch: ${{ inputs.caller-default-branch }}
          github-job-name: maven_pull_request_worker

      - name: Run a read-only PR worker build
        working-directory: build/integration-fixtures/maven-pull-request-worker
        run: mvn -B "-Dmaven.repo.local=$MAVEN_USER_HOME/repository" -P worker-a dependency:resolve

      - name: Require the worker's read-only prepare policy
        env:
          ACTION_BASE_CACHE_RESTORE_STATUS: ${{ steps.prepare.outputs.base-cache-restore-status }}
          ACTION_JOB_MODE: ${{ steps.prepare.outputs.job-mode }}
          ACTION_READ_ONLY: ${{ steps.prepare.outputs.read-only }}
          ACTION_DEPENDENT_DELTA_STATUS: ${{ steps.prepare.outputs.dependent-delta-status }}
          ACTION_DEPENDENT_DELTA_ARTIFACT_COUNT: ${{ steps.prepare.outputs.dependent-delta-artifact-count }}
        run: |
          test "$ACTION_JOB_MODE" = distributed-worker
          test "$ACTION_READ_ONLY" = true
          test "$ACTION_BASE_CACHE_RESTORE_STATUS" = miss
          test "$ACTION_DEPENDENT_DELTA_STATUS" = not-configured
          test "$ACTION_DEPENDENT_DELTA_ARTIFACT_COUNT" = 0

  maven_pull_request_read_only:
    name: Maven pull request aggregator (explicit read-only no-op)
    if: inputs.run-pr-scenarios
    needs: [maven_pull_request_worker]
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    defaults:
      run:
        shell: bash
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set isolated cache root
        env:
          IT_CACHE_HOME: ${{ runner.temp }}/mammoth-maven-maven_pull_request_read_only
        run: printf 'MAVEN_USER_HOME=%s\n' "$IT_CACHE_HOME" >> "$GITHUB_ENV"

      - name: Set up integration test environment
        uses: $/.github/actions/it-setup
        with:
          maven: 'true'

      - name: Stage fixture
        run: bash .github/scripts/stage-fixture.sh maven-pull-request

      - name: Require an empty tool home before prepare
        run: node .github/scripts/it-cache-fixture.mjs empty maven

      - name: Register lifecycle assertion after Mammoth post
        uses: ./.github/actions/it-observe # zizmor: ignore[self-repository] trusted writes are gated by the caller
        with:
          tool: maven
          job: maven_pull_request_read_only
          stage: pr

      - name: Prepare Mammoth Cache for Maven
        id: prepare
        uses: ./actions/github/maven # zizmor: ignore[self-repository] built by it-setup in this workspace
        with:
          base-directory: build/integration-fixtures/maven-pull-request
          job-mode: distributed-aggregator
          dependent-jobs: maven_pull_request_worker
          cache-key-prefix: it-maven-pr-${{ github.run_id }}-
          github-event-name: ${{ inputs.caller-event-name }}
          github-ref-name: ${{ inputs.caller-resolved-ref-name }}
          github-default-branch: ${{ inputs.caller-default-branch }}
          github-job-name: maven_pull_request_read_only

      - name: Run a read-only PR aggregator build
        working-directory: build/integration-fixtures/maven-pull-request
        run: mvn -B "-Dmaven.repo.local=$MAVEN_USER_HOME/repository" -P standalone dependency:resolve

      - name: Assert the PR default stayed read-only
        env:
          ACTION_BASE_CACHE_RESTORE_STATUS: ${{ steps.prepare.outputs.base-cache-restore-status }}
          ACTION_JOB_MODE: ${{ steps.prepare.outputs.job-mode }}
          ACTION_READ_ONLY: ${{ steps.prepare.outputs.read-only }}
          ACTION_DEPENDENT_DELTA_STATUS: ${{ steps.prepare.outputs.dependent-delta-status }}
          ACTION_DEPENDENT_DELTA_ARTIFACT_COUNT: ${{ steps.prepare.outputs.dependent-delta-artifact-count }}
        run: bash .github/scripts/it-assert-maven-pr.sh

  maven_standalone_cross_platform:
    name: Maven fresh reader (${{ matrix.reader.os }}, Java ${{ matrix.reader.java }})
    if: inputs.run-cross-platform && inputs.run-writable-scenarios
    needs: [maven_aggregator]
    runs-on: ${{ matrix.reader.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        reader:
          - { id: windows, os: windows-2025, arch: x64, java: '21' }
          - { id: macos, os: macos-15, arch: arm64, java: '25' }
    env:
      EXPECTED_ARCH: ${{ matrix.reader.arch }}
    defaults:
      run:
        shell: bash
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set isolated cache root
        env:
          IT_CACHE_HOME: ${{ runner.temp }}/mammoth-maven-reader-${{ matrix.reader.id }}
        run: printf 'MAVEN_USER_HOME=%s\n' "$IT_CACHE_HOME" >> "$GITHUB_ENV"

      - name: Set up integration test environment
        uses: $/.github/actions/it-setup
        with:
          java-version: ${{ matrix.reader.java }}
          maven: 'true'

      - name: Verify runner architecture
        run: node -e "require('node:assert/strict').equal(process.arch, process.env.EXPECTED_ARCH)"

      - name: Stage fresh fixture
        run: bash .github/scripts/stage-fixture.sh maven_reader-${{ matrix.reader.id }}

      - name: Require an empty tool home before prepare
        run: node .github/scripts/it-cache-fixture.mjs empty maven

      - name: Register lifecycle assertion after Mammoth post
        uses: ./.github/actions/it-observe # zizmor: ignore[self-repository] trusted writes are gated by the caller
        with:
          tool: maven
          job: maven_reader-${{ matrix.reader.id }}
          stage: reader

      - name: Prepare Mammoth Cache for Maven
        id: prepare
        uses: ./actions/github/maven # zizmor: ignore[self-repository] built by it-setup in this workspace
        with:
          base-directory: build/integration-fixtures/maven_reader-${{ matrix.reader.id }}
          job-mode: standalone
          cache-partitions: ${{ env.IT_CACHE_PARTITIONS }}
          cache-key-prefix: it-maven-distributed-${{ github.run_id }}-
          read-only: true
          github-event-name: ${{ inputs.caller-event-name }}
          github-ref-name: ${{ inputs.caller-resolved-ref-name }}
          github-default-branch: ${{ inputs.caller-default-branch }}
          github-job-name: maven_reader-${{ matrix.reader.id }}

      - name: Require the exact published generation
        uses: ./.github/actions/it-restore-proof # zizmor: ignore[self-repository] reads artifacts from this run
        with:
          tool: maven
          producer: maven_aggregator
          attempt: ${{ needs.maven_aggregator.outputs.attempt }}
          prepare: ${{ toJSON(steps.prepare.outputs) }}
          read-only: 'true'

      - name: Assert every worker filesystem contribution
        run: node .github/scripts/it-cache-fixture.mjs assert maven

      - name: Resolve all worker dependencies offline (POSIX)
        if: runner.os != 'Windows'
        working-directory: build/integration-fixtures/maven_reader-${{ matrix.reader.id }}
        run: mvn -B "-Dmaven.repo.local=$MAVEN_USER_HOME/repository" -P worker-a,worker-b,worker-c dependency:resolve --offline

      - name: Resolve all worker dependencies offline (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        working-directory: build/integration-fixtures/maven_reader-${{ matrix.reader.id }}
        run: |
          & mvn.cmd -B "-Dmaven.repo.local=$env:MAVEN_USER_HOME/repository" -P worker-a,worker-b,worker-c dependency:resolve --offline
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

  maven_warm:
    name: Linux Maven writable exact reuse
    if: inputs.run-writable-scenarios
    needs: [maven_aggregator]
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    defaults:
      run:
        shell: bash
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set isolated cache root
        env:
          IT_CACHE_HOME: ${{ runner.temp }}/mammoth-maven-warm
        run: printf 'MAVEN_USER_HOME=%s\n' "$IT_CACHE_HOME" >> "$GITHUB_ENV"

      - name: Set up integration test environment
        uses: $/.github/actions/it-setup
        with:
          maven: 'true'

      - name: Stage fresh fixture
        run: bash .github/scripts/stage-fixture.sh warm

      - name: Require an empty tool home before prepare
        run: node .github/scripts/it-cache-fixture.mjs empty maven

      - name: Register lifecycle assertion after Mammoth post
        uses: ./.github/actions/it-observe # zizmor: ignore[self-repository] trusted writes are gated by the caller
        with:
          tool: maven
          job: warm
          stage: warm

      - name: Prepare Mammoth Cache for Maven
        id: prepare
        uses: ./actions/github/maven # zizmor: ignore[self-repository] built by it-setup in this workspace
        with:
          base-directory: build/integration-fixtures/warm
          job-mode: standalone
          cache-partitions: ${{ env.IT_CACHE_PARTITIONS }}
          cache-key-prefix: it-maven-distributed-${{ github.run_id }}-
          github-event-name: ${{ inputs.caller-event-name }}
          github-ref-name: ${{ inputs.caller-resolved-ref-name }}
          github-default-branch: ${{ inputs.caller-default-branch }}
          github-job-name: warm

      - name: Require the exact published generation
        uses: ./.github/actions/it-restore-proof # zizmor: ignore[self-repository] reads artifacts from this run
        with:
          tool: maven
          producer: maven_aggregator
          attempt: ${{ needs.maven_aggregator.outputs.attempt }}
          prepare: ${{ toJSON(steps.prepare.outputs) }}
          read-only: 'false'

      - name: Verify restored worker contributions
        run: node .github/scripts/it-cache-fixture.mjs assert maven

  maven_change:
    name: Linux Maven metadata-visible change
    if: inputs.run-writable-scenarios
    needs: [maven_aggregator, maven_warm]
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    outputs:
      attempt: ${{ steps.observer.outputs.attempt }}
    defaults:
      run:
        shell: bash
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set isolated cache root
        env:
          IT_CACHE_HOME: ${{ runner.temp }}/mammoth-maven-change
        run: printf 'MAVEN_USER_HOME=%s\n' "$IT_CACHE_HOME" >> "$GITHUB_ENV"

      - name: Set up integration test environment
        uses: $/.github/actions/it-setup
        with:
          maven: 'true'

      - name: Stage fresh fixture
        run: bash .github/scripts/stage-fixture.sh change

      - name: Require an empty tool home before prepare
        run: node .github/scripts/it-cache-fixture.mjs empty maven

      - name: Register lifecycle assertion after Mammoth post
        id: observer
        uses: ./.github/actions/it-observe # zizmor: ignore[self-repository] trusted writes are gated by the caller
        with:
          tool: maven
          job: change
          stage: change

      - name: Prepare Mammoth Cache for Maven
        id: prepare
        uses: ./actions/github/maven # zizmor: ignore[self-repository] built by it-setup in this workspace
        with:
          base-directory: build/integration-fixtures/change
          job-mode: standalone
          cache-partitions: ${{ env.IT_CACHE_PARTITIONS }}
          cache-key-prefix: it-maven-distributed-${{ github.run_id }}-
          github-event-name: ${{ inputs.caller-event-name }}
          github-ref-name: mammoth-it-change-${{ github.run_id }}-a${{ github.run_attempt }}
          github-default-branch: ${{ inputs.caller-resolved-ref-name }}
          github-job-name: change

      - name: Require the exact published generation
        uses: ./.github/actions/it-restore-proof # zizmor: ignore[self-repository] reads artifacts from this run
        with:
          tool: maven
          producer: maven_aggregator
          attempt: ${{ needs.maven_aggregator.outputs.attempt }}
          prepare: ${{ toJSON(steps.prepare.outputs) }}
          restore-status: fallback-lineage-hit
          read-only: 'false'

      - name: Verify restored worker contributions
        run: node .github/scripts/it-cache-fixture.mjs assert maven

      - name: Write one metadata-visible fixture change
        run: node .github/scripts/it-cache-fixture.mjs change maven

  maven_changed_reader:
    name: Linux Maven fresh changed reader
    if: inputs.run-writable-scenarios
    needs: [maven_change]
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    defaults:
      run:
        shell: bash
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set isolated cache root
        env:
