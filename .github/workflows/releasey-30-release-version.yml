name: Releasey Release Version

on:
  workflow_dispatch:
    inputs:
      version:
        description: Exact version such as 1.2.3
        required: true
        type: string

permissions:
  contents: read

env:
  BUILDISH_RELEASE_TOOLING_REF: f37e09cc223d1e58d3095ad875db989fd8d5defe # renovate: datasource=github-releases depName=apache/buildish-release-tooling currentValue=v0.0.0
  BUILDISH_RELEASE_TOOLING_CHECKOUT_PATH: .buildish-internal/buildish-release-tooling

jobs:
  resolve-latest-rc:
    runs-on: ubuntu-latest
    outputs:
      selected_rc_tag: ${{ steps.release-version.outputs.selected_rc_tag }}
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
        with:
          repository: apache/buildish-release-tooling
          ref: ${{ env.BUILDISH_RELEASE_TOOLING_REF }}
          path: ${{ env.BUILDISH_RELEASE_TOOLING_CHECKOUT_PATH }}
          fetch-depth: 1
          persist-credentials: false
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
      - name: Install Python 3.13 for uv-managed commands
        run: uv python install 3.13
      - name: Fetch remote heads and tags
        run: |
          git fetch --force --prune --tags origin '+refs/heads/*:refs/remotes/origin/*'
      - id: release-version
        name: Resolve selected RC and pruning plan
        env:
          MANIFEST_PATH: ${{ runner.temp }}/release-version.json
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          bash buildish-release-tooling/release-tooling.sh release-version \
            "$RELEASE_VERSION"
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          import os
          from pathlib import Path

          manifest = json.loads(Path(os.environ["MANIFEST_PATH"]).read_text(encoding="utf-8"))
          print(f"selected_rc_tag={manifest['selected_rc_tag']}")
          PY

  publish-source-release-svn:
    needs: resolve-latest-rc
    runs-on: ubuntu-latest
    environment: draft-release-secrets
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
        with:
          repository: apache/buildish-release-tooling
          ref: ${{ env.BUILDISH_RELEASE_TOOLING_REF }}
          path: ${{ env.BUILDISH_RELEASE_TOOLING_CHECKOUT_PATH }}
          fetch-depth: 1
          persist-credentials: false
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
      - name: Install Python 3.13 for uv-managed commands
        run: uv python install 3.13
      - name: Fetch remote heads and tags
        run: |
          git fetch --force --prune --tags origin '+refs/heads/*:refs/remotes/origin/*'
      - name: Promote the selected RC source directory into ASF release dist
        env:
          BUILDISH_SVN_DEV_USERNAME: ${{ secrets.BUILDISH_SVN_DEV_USERNAME }}
          BUILDISH_SVN_DEV_PASSWORD: ${{ secrets.BUILDISH_SVN_DEV_PASSWORD }}
          SELECTED_RC_TAG: ${{ needs.resolve-latest-rc.outputs.selected_rc_tag }}
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          bash buildish-release-tooling/release-tooling.sh publish-source-release-svn \
            --selected-rc-tag "$SELECTED_RC_TAG" \
            "$RELEASE_VERSION"

  prune-older-line-releases:
    needs: publish-source-release-svn
    runs-on: ubuntu-latest
    environment: draft-release-secrets
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
        with:
          repository: apache/buildish-release-tooling
          ref: ${{ env.BUILDISH_RELEASE_TOOLING_REF }}
          path: ${{ env.BUILDISH_RELEASE_TOOLING_CHECKOUT_PATH }}
          fetch-depth: 1
          persist-credentials: false
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
      - name: Install Python 3.13 for uv-managed commands
        run: uv python install 3.13
      - name: Fetch remote heads and tags
        run: |
          git fetch --force --prune --tags origin '+refs/heads/*:refs/remotes/origin/*'
      - name: Prune older same-line releases from ASF release dist
        env:
          BUILDISH_SVN_DEV_USERNAME: ${{ secrets.BUILDISH_SVN_DEV_USERNAME }}
          BUILDISH_SVN_DEV_PASSWORD: ${{ secrets.BUILDISH_SVN_DEV_PASSWORD }}
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          bash buildish-release-tooling/release-tooling.sh prune-older-line-releases \
            "$RELEASE_VERSION"

  create-final-tag:
    needs:
      - resolve-latest-rc
      - publish-source-release-svn
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
        with:
          repository: apache/buildish-release-tooling
          ref: ${{ env.BUILDISH_RELEASE_TOOLING_REF }}
          path: ${{ env.BUILDISH_RELEASE_TOOLING_CHECKOUT_PATH }}
          fetch-depth: 1
          persist-credentials: false
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
      - name: Install Python 3.13 for uv-managed commands
        run: uv python install 3.13
      - name: Fetch remote heads and tags
        run: |
          git fetch --force --prune --tags origin '+refs/heads/*:refs/remotes/origin/*'
      - name: Create the immutable exact final tag from the released RC tag target
        env:
          GH_TOKEN: ${{ github.token }}
          SELECTED_RC_TAG: ${{ needs.resolve-latest-rc.outputs.selected_rc_tag }}
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          bash buildish-release-tooling/release-tooling.sh create-final-tag \
            --selected-rc-tag "$SELECTED_RC_TAG" \
            "$RELEASE_VERSION"

  publish-github-action-release:
    needs: create-final-tag
    runs-on: ubuntu-latest
    steps:
      - name: Draft GitHub Action publication
        run: |
          echo "TODO: publish immutable GitHub Release and action runtime assets from the final exact tag."

  update-moving-tags:
    needs: publish-github-action-release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
        with:
          repository: apache/buildish-release-tooling
          ref: ${{ env.BUILDISH_RELEASE_TOOLING_REF }}
          path: ${{ env.BUILDISH_RELEASE_TOOLING_CHECKOUT_PATH }}
          fetch-depth: 1
          persist-credentials: false
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
      - name: Install Python 3.13 for uv-managed commands
        run: uv python install 3.13
      - name: Fetch remote heads and tags
        run: |
          git fetch --force --prune --tags origin '+refs/heads/*:refs/remotes/origin/*'
      - name: Update Git tag-backed moving aliases
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          bash buildish-release-tooling/release-tooling.sh update-moving-tags \
            "$RELEASE_VERSION"

  finalize-draft-github-release:
    needs:
      - resolve-latest-rc
      - publish-github-action-release
      - update-moving-tags
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
        with:
          repository: apache/buildish-release-tooling
          ref: ${{ env.BUILDISH_RELEASE_TOOLING_REF }}
          path: ${{ env.BUILDISH_RELEASE_TOOLING_CHECKOUT_PATH }}
          fetch-depth: 1
          persist-credentials: false
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
      - name: Install Python 3.13 for uv-managed commands
        run: uv python install 3.13
      - name: Fetch remote heads and tags
        run: |
          git fetch --force --prune --tags origin '+refs/heads/*:refs/remotes/origin/*'
      - name: Finalize the draft GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          SELECTED_RC_TAG: ${{ needs.resolve-latest-rc.outputs.selected_rc_tag }}
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          bash buildish-release-tooling/release-tooling.sh finalize-draft-github-release \
            --selected-rc-tag "$SELECTED_RC_TAG" \
            "$RELEASE_VERSION"
