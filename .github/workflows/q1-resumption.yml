name: Q1 bounded resumption
on:
  push:
    branches: [cache-metadata-redesign]
    paths: [.github/q1-campaign.json]
permissions:
  contents: read
concurrency:
  group: q1-${{ github.ref }}
  cancel-in-progress: false
env:
  Q1_HEAD_SHA: ${{ github.sha }}
  Q1_ROUTE: ${{ contains(github.event.head_commit.message, '[Q1 resume-scale]') && 'resume-scale' || 'resume-graph' }}
jobs:
  scale:
    if: ${{ !cancelled() && github.repository == 'snazy/buildish-mammoth-cache' && github.ref == 'refs/heads/cache-metadata-redesign' && !contains(github.event.head_commit.message, '[Q1 campaign]') && !contains(github.event.head_commit.message, '[Q1 remaining]') && contains(github.event.head_commit.message, '[Q1 resume-scale]') && !contains(github.event.head_commit.message, '[Q1 resume-graph]') }}
    runs-on: ubuntu-26.04
    timeout-minutes: 17
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Read deliberate campaign gate
        id: campaign
        run: node scripts/qualification/gate.mjs
      - uses: $/.github/actions/it-setup
        if: steps.campaign.outputs.enabled == 'true'
        with:
          java-version: '21'
          maven: 'true'
      - name: Bounded Linux Maven-entrypoint exercise
        if: steps.campaign.outputs.enabled == 'true'
        timeout-minutes: 15
        uses: $/.github/actions/q1
        with:
          stage: scale
          platform: linux
      - name: Preserve bounded qualification records
        if: always() && steps.campaign.outputs.enabled == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: q1-resume-scale-linux-${{ github.run_attempt }}
          path: build/q1-results/
          retention-days: 3
          if-no-files-found: warn
  worker:
    if: ${{ !cancelled() && github.repository == 'snazy/buildish-mammoth-cache' && github.ref == 'refs/heads/cache-metadata-redesign' && !contains(github.event.head_commit.message, '[Q1 campaign]') && !contains(github.event.head_commit.message, '[Q1 remaining]') && contains(github.event.head_commit.message, '[Q1 resume-graph]') && !contains(github.event.head_commit.message, '[Q1 resume-scale]') }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { platform: linux, os: ubuntu-26.04 }
          - { platform: windows, os: windows-2025 }
          - { platform: macos, os: macos-15 }
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Read deliberate campaign gate
        id: campaign
        run: node scripts/qualification/gate.mjs
      - uses: $/.github/actions/it-setup
        if: steps.campaign.outputs.enabled == 'true'
        with:
          java-version: '21'
          maven: 'true'
      - name: Expose existing Windows GnuPG
        if: steps.campaign.outputs.enabled == 'true' && runner.os == 'Windows'
        shell: pwsh
        run: ./.github/scripts/expose-gpg-windows.ps1
      - name: Build read-only macOS classification helper
        if: steps.campaign.outputs.enabled == 'true' && runner.os == 'macOS'
        shell: bash
        run: node_modules/.bin/esbuild src/build-tool/gradle/darwin-process-inspection.ts --bundle --platform=node --target=node24 --format=cjs --outfile=build/q1-darwin-inspection.cjs
      - name: Exercise production bundles
        if: steps.campaign.outputs.enabled == 'true'
        uses: $/.github/actions/q1
        with:
          stage: worker
          platform: ${{ matrix.platform }}
      - name: Preserve bounded qualification records
        if: always() && steps.campaign.outputs.enabled == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: q1-resume-worker-${{ matrix.platform }}-${{ github.run_attempt }}
          path: build/q1-results/
          retention-days: 3
          if-no-files-found: warn
  aggregator:
    if: ${{ !cancelled() && github.repository == 'snazy/buildish-mammoth-cache' && github.ref == 'refs/heads/cache-metadata-redesign' && !contains(github.event.head_commit.message, '[Q1 campaign]') && !contains(github.event.head_commit.message, '[Q1 remaining]') && contains(github.event.head_commit.message, '[Q1 resume-graph]') && !contains(github.event.head_commit.message, '[Q1 resume-scale]') && needs.worker.result == 'success' }}
    needs: worker
    strategy:
      fail-fast: false
      matrix:
        include:
          - { platform: linux, os: ubuntu-26.04 }
          - { platform: windows, os: windows-2025 }
          - { platform: macos, os: macos-15 }
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Read deliberate campaign gate
        id: campaign
        run: node scripts/qualification/gate.mjs
      - uses: $/.github/actions/it-setup
        if: steps.campaign.outputs.enabled == 'true'
        with:
          java-version: '21'
          maven: 'true'
      - name: Expose existing Windows GnuPG
        if: steps.campaign.outputs.enabled == 'true' && runner.os == 'Windows'
        shell: pwsh
        run: ./.github/scripts/expose-gpg-windows.ps1
      - name: Build read-only macOS classification helper
        if: steps.campaign.outputs.enabled == 'true' && runner.os == 'macOS'
        shell: bash
        run: node_modules/.bin/esbuild src/build-tool/gradle/darwin-process-inspection.ts --bundle --platform=node --target=node24 --format=cjs --outfile=build/q1-darwin-inspection.cjs
      - name: Exercise production bundles
        if: steps.campaign.outputs.enabled == 'true'
        uses: $/.github/actions/q1
        with:
          stage: aggregator
          platform: ${{ matrix.platform }}
      - name: Preserve bounded qualification records
        if: always() && steps.campaign.outputs.enabled == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: q1-resume-aggregator-${{ matrix.platform }}-${{ github.run_attempt }}
          path: build/q1-results/
          retention-days: 3
          if-no-files-found: warn
  consumer:
    if: ${{ !cancelled() && github.repository == 'snazy/buildish-mammoth-cache' && github.ref == 'refs/heads/cache-metadata-redesign' && !contains(github.event.head_commit.message, '[Q1 campaign]') && !contains(github.event.head_commit.message, '[Q1 remaining]') && contains(github.event.head_commit.message, '[Q1 resume-graph]') && !contains(github.event.head_commit.message, '[Q1 resume-scale]') && needs.aggregator.result == 'success' }}
    needs: aggregator
    strategy:
      fail-fast: false
      matrix:
        include:
          - { platform: linux, os: ubuntu-26.04 }
          - { platform: windows, os: windows-2025 }
          - { platform: macos, os: macos-15 }
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Read deliberate campaign gate
        id: campaign
        run: node scripts/qualification/gate.mjs
      - uses: $/.github/actions/it-setup
        if: steps.campaign.outputs.enabled == 'true'
        with:
          java-version: '21'
          maven: 'true'
      - name: Expose existing Windows GnuPG
        if: steps.campaign.outputs.enabled == 'true' && runner.os == 'Windows'
        shell: pwsh
        run: ./.github/scripts/expose-gpg-windows.ps1
      - name: Build read-only macOS classification helper
        if: steps.campaign.outputs.enabled == 'true' && runner.os == 'macOS'
        shell: bash
        run: node_modules/.bin/esbuild src/build-tool/gradle/darwin-process-inspection.ts --bundle --platform=node --target=node24 --format=cjs --outfile=build/q1-darwin-inspection.cjs
      - name: Exercise production bundles
        if: steps.campaign.outputs.enabled == 'true'
        uses: $/.github/actions/q1
        with:
          stage: consumer
          platform: ${{ matrix.platform }}
      - name: Preserve bounded qualification records
        if: always() && steps.campaign.outputs.enabled == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: q1-resume-consumer-${{ matrix.platform }}-${{ github.run_attempt }}
          path: build/q1-results/
          retention-days: 3
          if-no-files-found: warn
