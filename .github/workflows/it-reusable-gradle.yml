name: IT Mammoth Cache for Gradle (Reusable)

# Real GitHub integration scenario graph for Mammoth Cache for Gradle.
#
# Standalone producer -> fresh offline reader.
# Worker matrix -> Linux aggregator -> native readers and Linux warm -> change -> changed reader.
# Pull requests exercise only the read-only worker -> aggregator pair.
# Distributed families stay stable across attempts so partial reruns can reuse worker artifacts.

on:
  workflow_call:
    inputs:
      caller-event-name:
        description: >-
          Original caller workflow event name. Reusable workflows execute as `workflow_call`, so
          the action needs the caller event to preserve event-based read-only and ref behavior.
        required: true
        type: string
      caller-resolved-ref-name:
        description: >-
          Logical ref name from the caller workflow that the action should treat as the effective
          branch for cache partitioning and summaries.
        required: true
        type: string
      caller-default-branch:
        description: >-
          Repository default branch from the caller workflow so reusable runs do not depend on the
          callee's `workflow_call` payload shape.
        required: true
        type: string
      run-pr-scenarios:
        description: >-
          Run the fork-safe pull-request worker/aggregator topology that verifies PR events stay
          read-only, workers upload nothing, and aggregation is an explicit no-op.
        required: true
        type: boolean
      run-writable-scenarios:
        description: >-
          Run the trusted Linux scenarios that are allowed to publish cache/artifact outputs:
          standalone cache round-trip, distributed worker/aggregator flow, and duplicate-job guard.
        required: true
        type: boolean
      run-cross-platform:
        description: >-
          Run native Windows/macOS workers and fresh readers through the existing
          distributed graph; false retains Linux-only distributed checks.
        required: false
        default: false
        type: boolean

permissions:
  # The scenarios are designed to work with repository read-access only. Cache and current-run
  # artifact operations use the Actions runtime; this workflow does not require broader repo scopes.
  contents: read

env:
  ACTION_DIRECTORY: .
  FIXTURE_SOURCE_DIRECTORY: test/fixtures/integration/gradle-project
  LAYER_CACHE_PARTITIONS: '[{"id":"dependency-metadata","writer":"layer-seed"}]'
  IT_CACHE_PARTITIONS: >-
    [{"id":"dependency-metadata","writer":"aggregator"},{"id":"it-portability","includes":["it-portability/**"],"publication":"aggregate"}]

jobs:
  standalone_round_trip:
    name: Linux Gradle standalone producer
    if: inputs.run-writable-scenarios
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    outputs:
      attempt: ${{ steps.observer.outputs.attempt }}
    defaults:
      run:
        shell: bash
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set isolated cache root
        env:
          IT_CACHE_HOME: ${{ runner.temp }}/mammoth-gradle-seed
        run: printf 'GRADLE_USER_HOME=%s\n' "$IT_CACHE_HOME" >> "$GITHUB_ENV"

      - name: Set up integration test environment
        uses: $/.github/actions/it-setup

      - name: Stage fresh fixture
        run: bash .github/scripts/stage-fixture.sh seed

      - name: Require an empty tool home before prepare
        run: node .github/scripts/it-cache-fixture.mjs empty gradle

      - name: Register lifecycle assertion after Mammoth post
        id: observer
        uses: ./.github/actions/it-observe # zizmor: ignore[self-repository] trusted writes are gated by the caller
        with:
          tool: gradle
          job: seed
          stage: seed

      - name: Prepare Mammoth Cache for Gradle
        id: prepare
        uses: ./actions/github/gradle # zizmor: ignore[self-repository] built by it-setup in this workspace
        with:
          base-directory: build/integration-fixtures/seed
          job-mode: standalone
          cache-key-prefix: it-gradle-standalone-${{ github.run_id }}-a${{ github.run_attempt }}-
          github-event-name: ${{ inputs.caller-event-name }}
          github-ref-name: ${{ inputs.caller-resolved-ref-name }}
          github-default-branch: ${{ inputs.caller-default-branch }}
          github-job-name: seed

      - name: Assert prepare outputs
        env:
          ACTION_CACHE_FAMILY_KEY: ${{ steps.prepare.outputs.cache-family-key }}
          ACTION_CACHE_LINEAGE_PREFIX: ${{ steps.prepare.outputs.cache-lineage-prefix }}
          ACTION_BASE_CACHE_RESTORE_STATUS: ${{ steps.prepare.outputs.base-cache-restore-status }}
          ACTION_JOB_MODE: ${{ steps.prepare.outputs.job-mode }}
          ACTION_READ_ONLY: ${{ steps.prepare.outputs.read-only }}
          ACTION_DEPENDENT_DELTA_STATUS: ${{ steps.prepare.outputs.dependent-delta-status }}
          ACTION_DEPENDENT_DELTA_ARTIFACT_COUNT: ${{ steps.prepare.outputs.dependent-delta-artifact-count }}
        run: bash .github/scripts/it-assert-gradle-standalone.sh

      - name: Resolve standalone dependencies online
        working-directory: build/integration-fixtures/seed
        run: ./gradlew --info --no-daemon resolveStandalone

      - name: Require the resolved standalone dependency
        run: node .github/scripts/it-cache-fixture.mjs standalone gradle

  standalone_reader:
    name: Linux Gradle standalone fresh reader
    if: inputs.run-writable-scenarios
    needs: [standalone_round_trip]
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    defaults:
      run:
        shell: bash
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set isolated cache root
        env:
          IT_CACHE_HOME: ${{ runner.temp }}/mammoth-gradle-standalone-reader
        run: printf 'GRADLE_USER_HOME=%s\n' "$IT_CACHE_HOME" >> "$GITHUB_ENV"

      - name: Set up integration test environment
        uses: $/.github/actions/it-setup

      - name: Stage fresh fixture
        run: bash .github/scripts/stage-fixture.sh standalone-reader

      - name: Require an empty tool home before prepare
        run: node .github/scripts/it-cache-fixture.mjs empty gradle

      - name: Register lifecycle assertion after Mammoth post
        uses: ./.github/actions/it-observe # zizmor: ignore[self-repository] trusted writes are gated by the caller
        with:
          tool: gradle
          job: standalone-reader
          stage: reader

      - name: Prepare Mammoth Cache for Gradle
        id: prepare
        uses: ./actions/github/gradle # zizmor: ignore[self-repository] built by it-setup in this workspace
        with:
          base-directory: build/integration-fixtures/standalone-reader
          job-mode: standalone
          cache-key-prefix: it-gradle-standalone-${{ github.run_id }}-a${{ needs.standalone_round_trip.outputs.attempt }}-
          read-only: true
          github-event-name: ${{ inputs.caller-event-name }}
          github-ref-name: ${{ inputs.caller-resolved-ref-name }}
          github-default-branch: ${{ inputs.caller-default-branch }}
          github-job-name: standalone-reader

      - name: Require the exact published generation
        uses: ./.github/actions/it-restore-proof # zizmor: ignore[self-repository] reads artifacts from this run
        with:
          tool: gradle
          producer: seed
          attempt: ${{ needs.standalone_round_trip.outputs.attempt }}
          prepare: ${{ toJSON(steps.prepare.outputs) }}
          read-only: 'true'

      - name: Require dependency bytes before the offline build
        run: node .github/scripts/it-cache-fixture.mjs standalone gradle

      - name: Execute restored POSIX distribution launcher
        run: node .github/scripts/it-cache-fixture.mjs launcher gradle

      - name: Resolve dependencies offline
        working-directory: build/integration-fixtures/standalone-reader
        run: ./gradlew --offline --info --no-daemon --console=plain resolveStandalone

  workers:
    name: Gradle distributed ${{ matrix.worker.id }} (${{ matrix.worker.os }}, Java ${{ matrix.worker.java }})
    if: inputs.run-writable-scenarios
    runs-on: ${{ matrix.worker.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        worker:
          - id: worker_a
            fixture: worker_a
            os: ubuntu-26.04
            arch: x64
            java: '21'
            task: resolveWorkerA
          - id: worker_b
            fixture: worker_b
            os: ${{ inputs.run-cross-platform && 'windows-2025' || 'ubuntu-26.04' }}
            arch: x64
            java: '25'
            task: resolveWorkerB
          - id: worker_c
            fixture: worker_c
            os: ${{ inputs.run-cross-platform && 'macos-15' || 'ubuntu-26.04' }}
            arch: ${{ inputs.run-cross-platform && 'arm64' || 'x64' }}
            java: '21'
            task: resolveWorkerC
    env:
      EXPECTED_ARCH: ${{ matrix.worker.arch }}
    defaults:
      run:
        shell: bash
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set isolated cache root
        env:
          IT_CACHE_HOME: ${{ runner.temp }}/mammoth-gradle-${{ matrix.worker.id }}
        run: printf 'GRADLE_USER_HOME=%s\n' "$IT_CACHE_HOME" >> "$GITHUB_ENV"

      - name: Set up integration test environment
        uses: $/.github/actions/it-setup
        with:
          java-version: ${{ matrix.worker.java }}
          maven: 'false'

      - name: Verify runner architecture
        run: node -e "require('node:assert/strict').equal(process.arch, process.env.EXPECTED_ARCH)"

      - name: Expose GnuPG on Windows PATH
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./.github/scripts/expose-gpg-windows.ps1

      - name: Stage fixture
        run: bash .github/scripts/stage-fixture.sh ${{ matrix.worker.id }}

      - name: Require an empty tool home before prepare
        run: node .github/scripts/it-cache-fixture.mjs empty gradle

      - name: Register lifecycle assertion after Mammoth post
        uses: ./.github/actions/it-observe # zizmor: ignore[self-repository] trusted writes are gated by the caller
        with:
          tool: gradle
          job: ${{ matrix.worker.id }}
          stage: worker

      - name: Prepare Mammoth Cache for Gradle
        id: prepare
        uses: ./actions/github/gradle # zizmor: ignore[self-repository] built by it-setup in this workspace
        with:
          base-directory: build/integration-fixtures/${{ matrix.worker.id }}
          job-mode: distributed-worker
          cache-partitions: ${{ env.IT_CACHE_PARTITIONS }}
          cache-key-prefix: it-gradle-distributed-${{ github.run_id }}-
          github-event-name: ${{ inputs.caller-event-name }}
          github-ref-name: ${{ inputs.caller-resolved-ref-name }}
          github-default-branch: ${{ inputs.caller-default-branch }}
          github-job-name: ${{ matrix.worker.id }}

      - name: Seed worker filesystem contribution
        run: node .github/scripts/it-cache-fixture.mjs seed gradle ${{ matrix.worker.fixture }}

      - name: Produce worker dependency and portable output independently (POSIX)
        if: runner.os != 'Windows'
        working-directory: build/integration-fixtures/${{ matrix.worker.id }}
        env:
          WORKER_TASK: ${{ matrix.worker.task }}
        run: |
          ./gradlew --info --no-daemon --console=plain --build-cache "$WORKER_TASK" portable

      - name: Produce worker dependency and portable output independently (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        working-directory: build/integration-fixtures/${{ matrix.worker.id }}
        env:
          WORKER_TASK: ${{ matrix.worker.task }}
        run: |
          & ./gradlew.bat --info --no-daemon --console=plain --build-cache $env:WORKER_TASK portable
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

  aggregator:
    name: Linux Gradle distributed aggregator (merge and publish)
    if: inputs.run-writable-scenarios
    needs: [workers]
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    outputs:
      attempt: ${{ steps.observer.outputs.attempt }}
    env:
      EXPECTED_ARCH: x64
    defaults:
      run:
        shell: bash
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set isolated cache root
        env:
          IT_CACHE_HOME: ${{ runner.temp }}/mammoth-gradle-aggregator
        run: printf 'GRADLE_USER_HOME=%s\n' "$IT_CACHE_HOME" >> "$GITHUB_ENV"

      - name: Set up integration test environment
        uses: $/.github/actions/it-setup
        with:
          java-version: '21'
          maven: 'false'

      - name: Verify runner architecture
        run: node -e "require('node:assert/strict').equal(process.arch, process.env.EXPECTED_ARCH)"

      - name: Expose GnuPG on Windows PATH
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./.github/scripts/expose-gpg-windows.ps1

      - name: Stage fixture
        run: bash .github/scripts/stage-fixture.sh aggregator

      - name: Require an empty tool home before prepare
        run: node .github/scripts/it-cache-fixture.mjs empty gradle

      - name: Register lifecycle assertion after Mammoth post
        id: observer
        uses: ./.github/actions/it-observe # zizmor: ignore[self-repository] trusted writes are gated by the caller
        with:
          tool: gradle
          job: aggregator
          stage: aggregator

      - name: Prepare Mammoth Cache for Gradle
        id: prepare
        uses: ./actions/github/gradle # zizmor: ignore[self-repository] built by it-setup in this workspace
        with:
          base-directory: build/integration-fixtures/aggregator
          job-mode: distributed-aggregator
          cache-partitions: ${{ env.IT_CACHE_PARTITIONS }}
          cache-key-prefix: it-gradle-distributed-${{ github.run_id }}-
          dependent-jobs: worker_a,worker_b,worker_c
          github-event-name: ${{ inputs.caller-event-name }}
          github-ref-name: ${{ inputs.caller-resolved-ref-name }}
          github-default-branch: ${{ inputs.caller-default-branch }}
          github-job-name: aggregator

      - name: Assert aggregator action outputs
        env:
          ACTION_BASE_CACHE_RESTORE_STATUS: ${{ steps.prepare.outputs.base-cache-restore-status }}
          ACTION_JOB_MODE: ${{ steps.prepare.outputs.job-mode }}
          ACTION_READ_ONLY: ${{ steps.prepare.outputs.read-only }}
          ACTION_DEPENDENT_DELTA_STATUS: ${{ steps.prepare.outputs.dependent-delta-status }}
          ACTION_DEPENDENT_DELTA_ARTIFACT_COUNT: ${{ steps.prepare.outputs.dependent-delta-artifact-count }}
        run: bash .github/scripts/it-assert-gradle-aggregator.sh

      - name: Inspect restored Groovy workspaces before Gradle can rebuild them
        run: node .github/scripts/it-cache-fixture.mjs groovy gradle

      - name: Build the designated metadata snapshot without re-downloading worker JARs
        working-directory: build/integration-fixtures/aggregator
        run: bash "$GITHUB_WORKSPACE/.github/scripts/it-verify-worker-deltas.sh"

      - name: Assert every worker filesystem contribution
        run: node .github/scripts/it-cache-fixture.mjs assert gradle

      - name: Execute restored POSIX distribution launcher
        if: runner.os != 'Windows'
        run: node .github/scripts/it-cache-fixture.mjs launcher gradle

      - name: Verify restored dependencies and portable output offline (POSIX)
        if: runner.os != 'Windows'
        working-directory: build/integration-fixtures/aggregator
        run: ./gradlew --offline --info --no-daemon --console=plain --build-cache resolveWorkerA resolveWorkerB resolveWorkerC portable 2>&1 | tee verify.log

      - name: Verify restored dependencies and portable output offline (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        working-directory: build/integration-fixtures/aggregator
        run: |
          & ./gradlew.bat --offline --info --no-daemon --console=plain --build-cache resolveWorkerA resolveWorkerB resolveWorkerC portable 2>&1 | Tee-Object -FilePath verify.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Assert dependency resolution and portable task cache hit
        run: node .github/scripts/it-cache-fixture.mjs gradle-log gradle build/integration-fixtures/aggregator/verify.log

  duplicate_invocation_guard:
    name: Linux duplicate invocation guard (same-job safety)
    if: inputs.run-writable-scenarios
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    defaults:
      run:
        shell: bash
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up integration test environment
        uses: $/.github/actions/it-setup

      - name: Stage fixture
        run: bash .github/scripts/stage-fixture.sh duplicate-guard

      - name: First action invocation succeeds
        uses: ./actions/github/gradle # zizmor: ignore[self-repository] built by it-setup in this workspace
        with:
          base-directory: build/integration-fixtures/duplicate-guard
          cache-enabled: false
          read-only: true
          github-event-name: ${{ inputs.caller-event-name }}
          github-ref-name: ${{ inputs.caller-resolved-ref-name }}
          github-default-branch: ${{ inputs.caller-default-branch }}
          github-job-name: duplicate_invocation_guard

      - name: Confirm the fixture Gradle wrapper runs
        working-directory: build/integration-fixtures/duplicate-guard
        run: ./gradlew --info --version

      - name: Duplicate action invocation is rejected
        id: duplicate_action
        continue-on-error: true
        uses: ./actions/github/gradle # zizmor: ignore[self-repository] built by it-setup in this workspace
        with:
          base-directory: build/integration-fixtures/duplicate-guard
          cache-enabled: false
          read-only: true
          github-event-name: ${{ inputs.caller-event-name }}
          github-ref-name: ${{ inputs.caller-resolved-ref-name }}
          github-default-branch: ${{ inputs.caller-default-branch }}
          github-job-name: duplicate_invocation_guard

      - name: Assert the duplicate invocation failed
        run: test "${STEPS_DUPLICATE_ACTION_OUTCOME}" = 'failure'
        env:
          STEPS_DUPLICATE_ACTION_OUTCOME: ${{ steps.duplicate_action.outcome }}

  pull_request_worker:
    name: Pull request distributed worker (no artifact upload)
    if: inputs.run-pr-scenarios
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    defaults:
      run:
        shell: bash
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set isolated cache root
        env:
          IT_CACHE_HOME: ${{ runner.temp }}/mammoth-gradle-pull_request_worker
        run: printf 'GRADLE_USER_HOME=%s\n' "$IT_CACHE_HOME" >> "$GITHUB_ENV"

      - name: Set up integration test environment
        uses: $/.github/actions/it-setup

      - name: Stage fixture
        run: bash .github/scripts/stage-fixture.sh pull-request-worker

      - name: Require an empty tool home before prepare
        run: node .github/scripts/it-cache-fixture.mjs empty gradle

      - name: Register lifecycle assertion after Mammoth post
        uses: ./.github/actions/it-observe # zizmor: ignore[self-repository] trusted writes are gated by the caller
        with:
          tool: gradle
          job: pull_request_worker
          stage: pr

      - name: Prepare Mammoth Cache for Gradle
        id: prepare
        uses: ./actions/github/gradle # zizmor: ignore[self-repository] built by it-setup in this workspace
        with:
          base-directory: build/integration-fixtures/pull-request-worker
          job-mode: distributed-worker
          cache-key-prefix: it-pr-${{ github.run_id }}-
          github-event-name: ${{ inputs.caller-event-name }}
          github-ref-name: ${{ inputs.caller-resolved-ref-name }}
          github-default-branch: ${{ inputs.caller-default-branch }}
          github-job-name: pull_request_worker

      - name: Run a read-only PR worker build
        working-directory: build/integration-fixtures/pull-request-worker
        run: ./gradlew --info --no-daemon resolveWorkerA

      - name: Require the worker's read-only prepare policy
        env:
          ACTION_BASE_CACHE_RESTORE_STATUS: ${{ steps.prepare.outputs.base-cache-restore-status }}
          ACTION_JOB_MODE: ${{ steps.prepare.outputs.job-mode }}
          ACTION_READ_ONLY: ${{ steps.prepare.outputs.read-only }}
          ACTION_DEPENDENT_DELTA_STATUS: ${{ steps.prepare.outputs.dependent-delta-status }}
          ACTION_DEPENDENT_DELTA_ARTIFACT_COUNT: ${{ steps.prepare.outputs.dependent-delta-artifact-count }}
        run: |
          test "$ACTION_JOB_MODE" = distributed-worker
          test "$ACTION_READ_ONLY" = true
          test "$ACTION_BASE_CACHE_RESTORE_STATUS" = miss
          test "$ACTION_DEPENDENT_DELTA_STATUS" = not-configured
          test "$ACTION_DEPENDENT_DELTA_ARTIFACT_COUNT" = 0

  pull_request_read_only:
    name: Pull request aggregator (explicit read-only no-op)
    if: inputs.run-pr-scenarios
    needs: [pull_request_worker]
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    defaults:
      run:
        shell: bash
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set isolated cache root
        env:
          IT_CACHE_HOME: ${{ runner.temp }}/mammoth-gradle-pull_request_read_only
        run: printf 'GRADLE_USER_HOME=%s\n' "$IT_CACHE_HOME" >> "$GITHUB_ENV"

      - name: Set up integration test environment
        uses: $/.github/actions/it-setup

      - name: Stage fixture
        run: bash .github/scripts/stage-fixture.sh pull-request

      - name: Require an empty tool home before prepare
        run: node .github/scripts/it-cache-fixture.mjs empty gradle

      - name: Register lifecycle assertion after Mammoth post
        uses: ./.github/actions/it-observe # zizmor: ignore[self-repository] trusted writes are gated by the caller
        with:
          tool: gradle
          job: pull_request_read_only
          stage: pr

      - name: Prepare Mammoth Cache for Gradle
        id: prepare
        uses: ./actions/github/gradle # zizmor: ignore[self-repository] built by it-setup in this workspace
        with:
          base-directory: build/integration-fixtures/pull-request
          job-mode: distributed-aggregator
          dependent-jobs: pull_request_worker
          cache-key-prefix: it-pr-${{ github.run_id }}-
          github-event-name: ${{ inputs.caller-event-name }}
          github-ref-name: ${{ inputs.caller-resolved-ref-name }}
          github-default-branch: ${{ inputs.caller-default-branch }}
          github-job-name: pull_request_read_only

      - name: Run a read-only PR aggregator build
        working-directory: build/integration-fixtures/pull-request
        run: ./gradlew --info --no-daemon resolveStandalone

      - name: Assert the PR default stayed read-only
        env:
          ACTION_BASE_CACHE_RESTORE_STATUS: ${{ steps.prepare.outputs.base-cache-restore-status }}
          ACTION_JOB_MODE: ${{ steps.prepare.outputs.job-mode }}
          ACTION_READ_ONLY: ${{ steps.prepare.outputs.read-only }}
          ACTION_DEPENDENT_DELTA_STATUS: ${{ steps.prepare.outputs.dependent-delta-status }}
          ACTION_DEPENDENT_DELTA_ARTIFACT_COUNT: ${{ steps.prepare.outputs.dependent-delta-artifact-count }}
        run: bash .github/scripts/it-assert-gradle-pr.sh

  standalone_cross_platform:
    name: Gradle fresh reader (${{ matrix.reader.os }}, Java ${{ matrix.reader.java }})
    if: inputs.run-cross-platform && inputs.run-writable-scenarios
    needs: [aggregator]
    runs-on: ${{ matrix.reader.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        reader:
          - { id: windows, os: windows-2025, arch: x64, java: '21' }
          - { id: macos, os: macos-15, arch: arm64, java: '25' }
    env:
      EXPECTED_ARCH: ${{ matrix.reader.arch }}
    defaults:
      run:
        shell: bash
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set isolated cache root
        env:
          IT_CACHE_HOME: ${{ runner.temp }}/mammoth-gradle-reader-${{ matrix.reader.id }}
        run: printf 'GRADLE_USER_HOME=%s\n' "$IT_CACHE_HOME" >> "$GITHUB_ENV"

      - name: Set up integration test environment
        uses: $/.github/actions/it-setup
        with:
          java-version: ${{ matrix.reader.java }}
          maven: 'false'

      - name: Verify native aggregate restore boundaries
        run: npm test -- test/cache/streaming/base-move-boundaries.test.ts -t 'restores a trusted aggregate|keeps the accessor workspace kind'

      - name: Verify runner architecture
        run: node -e "require('node:assert/strict').equal(process.arch, process.env.EXPECTED_ARCH)"

      - name: Expose GnuPG on Windows PATH
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./.github/scripts/expose-gpg-windows.ps1

      - name: Stage fresh fixture
        run: bash .github/scripts/stage-fixture.sh reader-${{ matrix.reader.id }}

      - name: Require an empty tool home before prepare
