name: CI

# Single entry workflow for local verification plus real GitHub integration scenarios.
#
# Event routing:
# - push / workflow_dispatch / schedule -> trusted writable integration scenario suite
# - pull_request -> fork-safe read-only integration scenario suite

on:
  push:
    branches:
      - main
      - release/**
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    name: Make check
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Show available Make targets
        run: make help

      - name: Clean workspace outputs
        run: make clean-all

      - name: Build the project
        run: make build

      - name: Run bundled Category X license gate
        run: make release-legal-category-x-check

      - name: Run unit tests
        run: make test

      - name: Run lint and formatting checks
        run: make lint-check

      - name: Set up Java 21
        uses: actions/setup-java@dded0888837ed1f317902acf8a20df0ad188d165 # v5.0.0
        with:
          distribution: temurin
          java-version: '21'

      - name: Run Apache RAT
        run: npm run rat-check

  smoke-test-gradle:
    name: Run local Gradle action
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Build the action bundle
        run: make build

      - name: Set up Java 21
        uses: actions/setup-java@dded0888837ed1f317902acf8a20df0ad188d165 # v5.0.0
        with:
          distribution: temurin
          java-version: '21'

      - name: Stage smoke fixture in build directory
        run: |
          rm -rf build/smoke-fixture
          mkdir -p build
          cp -R test/fixtures/smoke build/smoke-fixture

      - name: Run the local Gradle action
        uses: ./actions/github/gradle
        with:
          base-directory: build/smoke-fixture

  smoke-test-maven:
    name: Run local Maven action
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Build the action bundle
        run: make build

      - name: Set up Java 21
        uses: actions/setup-java@dded0888837ed1f317902acf8a20df0ad188d165 # v5.0.0
        with:
          distribution: temurin
          java-version: '21'

      - name: Stage Maven smoke fixture in build directory
        run: |
          rm -rf build/smoke-fixture-maven
          mkdir -p build
          cp -R test/fixtures/smoke/maven build/smoke-fixture-maven

      - name: Run the local Maven action
        uses: ./actions/github/maven
        with:
          base-directory: build/smoke-fixture-maven

  integration-trusted-gradle:
    name: Trusted GitHub integration scenarios (Gradle)
    if: github.event_name != 'pull_request'
    uses: ./.github/workflows/it-reusable-gradle.yml
    with:
      caller-event-name: ${{ github.event_name }}
      caller-resolved-ref-name: ${{ github.event_name == 'schedule' && github.event.repository.default_branch || github.ref_name }}
      caller-default-branch: ${{ github.event.repository.default_branch }}
      run-pr-scenarios: false
      run-writable-scenarios: true
      run-cross-platform: ${{ github.event_name == 'workflow_dispatch' || github.event_name == 'schedule' || github.ref_name == github.event.repository.default_branch }}

  integration-pr-gradle:
    name: Pull request GitHub integration scenarios (Gradle)
    if: github.event_name == 'pull_request'
    uses: ./.github/workflows/it-reusable-gradle.yml
    with:
      caller-event-name: ${{ github.event_name }}
      caller-resolved-ref-name: ${{ github.base_ref }}
      caller-default-branch: ${{ github.event.repository.default_branch }}
      run-pr-scenarios: true
      run-writable-scenarios: false
      run-cross-platform: false

  integration-trusted-maven:
    name: Trusted GitHub integration scenarios (Maven)
    if: github.event_name != 'pull_request'
    uses: ./.github/workflows/it-reusable-maven.yml
    with:
      caller-event-name: ${{ github.event_name }}
      caller-resolved-ref-name: ${{ github.event_name == 'schedule' && github.event.repository.default_branch || github.ref_name }}
      caller-default-branch: ${{ github.event.repository.default_branch }}
      run-pr-scenarios: false
      run-writable-scenarios: true
      run-cross-platform: ${{ github.event_name == 'workflow_dispatch' || github.event_name == 'schedule' || github.ref_name == github.event.repository.default_branch }}

  integration-pr-maven:
    name: Pull request GitHub integration scenarios (Maven)
    if: github.event_name == 'pull_request'
    uses: ./.github/workflows/it-reusable-maven.yml
    with:
      caller-event-name: ${{ github.event_name }}
      caller-resolved-ref-name: ${{ github.base_ref }}
      caller-default-branch: ${{ github.event.repository.default_branch }}
      run-pr-scenarios: true
      run-writable-scenarios: false
      run-cross-platform: false

  codeql:
    name: CodeQL (JavaScript / TypeScript)
    # Requires GitHub Advanced Security, available for public repositories in the
    # apache organisation. Skips cleanly elsewhere — remove this condition once
    # the repository has been transferred to the apache organisation.
    if: github.repository_owner == 'apache'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
      actions: read
    steps:
      - name: Check out repository
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
        with:
          persist-credentials: false

      - name: Initialize CodeQL
        uses: github/codeql-action/init@5c8a8a642e79153f5d047b10ec1cba1d1cc65699 # v3.35.1
        with:
          languages: javascript-typescript
          build-mode: none

      - name: Perform CodeQL analysis
        uses: github/codeql-action/analyze@5c8a8a642e79153f5d047b10ec1cba1d1cc65699 # v3.35.1
        with:
          category: /language:javascript-typescript

  zizmor:
    name: Zizmor (GitHub Actions security)
    # Requires GitHub Advanced Security, available for public repositories in the
    # apache organisation. Skips cleanly elsewhere.
    if: github.repository_owner == 'apache'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Check out repository
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
        with:
          persist-credentials: false

      - name: Run Zizmor 🌈
        uses: zizmorcore/zizmor-action@71321a20a9ded102f6e9ce5718a2fcec2c4f70d8 # v0.5.2

  required_checks:
    name: Required Checks
    if: ${{ always() }}
    needs:
      - check
      - smoke-test-gradle
      - smoke-test-maven
      - integration-trusted-gradle
      - integration-pr-gradle
      - integration-trusted-maven
      - integration-pr-maven
      - codeql
      - zizmor
    runs-on: ubuntu-latest
    steps:
      - name: Assert all required jobs succeeded or were intentionally skipped
        env:
          CHECK_RESULT: ${{ needs.check.result }}
          SMOKE_TEST_RESULT: ${{ needs.smoke-test-gradle.result }}
          SMOKE_TEST_MAVEN_RESULT: ${{ needs.smoke-test-maven.result }}
          INTEGRATION_TRUSTED_GRADLE_RESULT: ${{ needs.integration-trusted-gradle.result }}
          INTEGRATION_PR_GRADLE_RESULT: ${{ needs.integration-pr-gradle.result }}
          INTEGRATION_TRUSTED_MAVEN_RESULT: ${{ needs.integration-trusted-maven.result }}
          INTEGRATION_PR_MAVEN_RESULT: ${{ needs.integration-pr-maven.result }}
          CODEQL_RESULT: ${{ needs.codeql.result }}
          ZIZMOR_RESULT: ${{ needs.zizmor.result }}
        run: |
          for result in \
            "$CHECK_RESULT" \
            "$SMOKE_TEST_RESULT" \
            "$SMOKE_TEST_MAVEN_RESULT" \
            "$INTEGRATION_TRUSTED_GRADLE_RESULT" \
            "$INTEGRATION_PR_GRADLE_RESULT" \
            "$INTEGRATION_TRUSTED_MAVEN_RESULT" \
            "$INTEGRATION_PR_MAVEN_RESULT" \
            "$CODEQL_RESULT" \
            "$ZIZMOR_RESULT"; do
            case "$result" in
              success|skipped) ;;
              *)
                echo "Unexpected dependency result: $result"
                exit 1
                ;;
            esac
          done

          echo "All required jobs succeeded for this event."
